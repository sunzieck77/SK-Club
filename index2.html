                                    })}
                                    {filteredReportClubs.length === 0 && (
                                        <tr><td colSpan="5" className="p-8 text-center text-gray-400 font-medium text-xs sm:text-sm">ไม่พบข้อมูลที่ค้นหา</td></tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {reportType === 'classes' && (
                        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 sm:gap-4 max-h-[500px] overflow-y-auto custom-scrollbar p-1">
                            {sortedClasses.map(cls => {
                                const classStudents = students.filter(s => s.classId === cls.dbKey);
                                const registeredCount = classStudents.filter(s => s.clubId).length;
                                
                                return (
                                    <div 
                                        key={cls.dbKey}
                                        onClick={() => setSelectedReportClass(cls)}
                                        className="bg-white border border-gray-200 p-4 rounded-xl hover:border-blue-400 hover:shadow-md cursor-pointer transition transform hover:-translate-y-1 flex flex-col justify-between h-full"
                                    >
                                        <div className="flex justify-between items-center mb-2">
                                            <h4 className="text-lg sm:text-xl font-black text-gray-800">ม.{cls.grade}/{cls.room}</h4>
                                            <ChevronRight size={16} className="text-gray-300" />
                                        </div>
                                        <div className="text-[10px] sm:text-xs text-gray-500 space-y-1 mt-2">
                                            <p>นักเรียนทั้งหมด: {classStudents.length} คน</p>
                                            <p className="text-green-600 font-bold">ลงแล้ว: {registeredCount} คน</p>
                                            <p className="text-red-500">ยังไม่ลง: {classStudents.length - registeredCount} คน</p>
                                        </div>
                                    </div>
                                );
                            })}
                            {sortedClasses.length === 0 && (
                                <div className="col-span-full text-center py-10 text-gray-400 text-sm">ยังไม่มีข้อมูลห้องเรียน</div>
                            )}
                        </div>
                    )}

                    {selectedReportClub && (
                        <Modal isOpen={!!selectedReportClub} onClose={() => setSelectedReportClub(null)} title={`รายชื่อนักเรียน: ${selectedReportClub.name}`} maxWidth="max-w-2xl">
                            <div className="mb-4 bg-gray-50 p-3 rounded-xl border border-gray-100 flex flex-wrap justify-between items-center gap-2">
                                <div className="flex gap-2 sm:gap-4 items-center flex-wrap">
                                    <span className="text-xs sm:text-sm font-bold text-gray-600">ครูผู้สอน: {selectedReportClub.teacher}</span>
                                    <span className="text-xs sm:text-sm font-bold text-gray-600 bg-white px-3 py-1 rounded-lg border border-gray-200">
                                        ยอดรับ: {modalStudents.length}/{selectedReportClub.capacity}
                                    </span>
                                </div>
                                <button 
                                    onClick={handleDownloadClubXLSX}
                                    className="bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-lg text-[10px] sm:text-xs font-bold flex items-center gap-1.5 transition shadow-sm"
                                >
                                    <Download size={14} /> โหลดรายชื่อ (XLSX)
                                </button>
                            </div>
                            <div className="overflow-x-auto rounded-xl border border-gray-200">
                                <table className="w-full text-left text-[10px] sm:text-xs whitespace-nowrap">
                                    <thead className="bg-gray-100 border-b border-gray-200">
                                        <tr>
                                            <th className="p-3 font-bold text-gray-600">ลำดับ</th>
                                            <th className="p-3 font-bold text-gray-600">ห้อง</th>
                                            <th className="p-3 font-bold text-gray-600">เลขที่</th>
                                            <th className="p-3 font-bold text-gray-600">รหัสประจำตัว</th>
                                            <th className="p-3 font-bold text-gray-600">ชื่อ-สกุล</th>
                                            <th className="p-3 font-bold text-gray-600">เวลาที่ลงทะเบียน</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-100">
                                        {modalStudents.length === 0 ? (
                                            <tr><td colSpan="6" className="p-4 text-center text-gray-400">ไม่มีข้อมูลผู้สมัคร</td></tr>
                                        ) : modalStudents.map((st, idx) => {
                                            const sClass = classes.find(c => c.dbKey === st.classId);
                                            return (
                                                <tr key={st.dbKey} className="hover:bg-gray-50">
                                                    <td className="p-3 text-center text-gray-500 font-bold">{idx + 1}</td>
                                                    <td className="p-3 font-medium">ม.{sClass?.grade}/{sClass?.room}</td>
                                                    <td className="p-3 text-center">{st.number}</td>
                                                    <td className="p-3">{st.studentId}</td>
                                                    <td className="p-3">{st.name}</td>
                                                    <td className="p-3 text-gray-500">{st.joinedAt ? new Date(st.joinedAt).toLocaleString('th-TH') : '-'}</td>
                                                </tr>
                                            )
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </Modal>
                    )}

                    {selectedReportClass && (
                        <Modal isOpen={!!selectedReportClass} onClose={() => {setSelectedReportClass(null); setSelectedReportStudent(null);}} title={`รายงานห้องเรียน: ม.${selectedReportClass.grade}/${selectedReportClass.room}`} maxWidth={selectedReportStudent ? "max-w-md" : "max-w-2xl"}>
                            <div className="overflow-x-auto rounded-xl border border-gray-200 custom-scrollbar max-h-[60vh]">
                                <table className="w-full text-left text-[10px] sm:text-xs whitespace-nowrap">
                                    <thead className="bg-gray-100 border-b border-gray-200 sticky top-0">
                                        <tr>
                                            <th className="p-3 font-bold text-gray-600">เลขที่</th>
                                            <th className="p-3 font-bold text-gray-600">ชื่อ-สกุล</th>
                                            <th className="p-3 font-bold text-gray-600">สถานะ</th>
                                            <th className="p-3 font-bold text-gray-600">ชุมนุมที่เลือก</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-100">
                                        {[...modalStudents].sort((a,b) => (a.number||0) - (b.number||0)).map((st) => {
                                            const hasClub = !!st.clubId;
                                            const club = clubs.find(c => c.dbKey === st.clubId);
                                            return (
                                                <tr key={st.dbKey} className="hover:bg-gray-50">
                                                    <td className="p-3 text-center">{st.number}</td>
                                                    <td className="p-3 font-medium">{st.name}</td>
                                                    <td className="p-3">
                                                        <span className={`px-2 py-1 rounded text-[9px] font-bold ${hasClub ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-600'}`}>
                                                            {hasClub ? 'ลงแล้ว' : 'ยังไม่ลง'}
                                                        </span>
                                                    </td>
                                                    <td className="p-3">
                                                        {hasClub ? club?.name || 'ไม่ทราบ' : '-'}
                                                    </td>
                                                </tr>
                                            )
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </Modal>
                    )}
                </div>
            );
        }

        // --- ADMIN: CLUBS ---
        function AdminClubs({ clubs, students, onDataRefresh }) {
            const [viewFilter, setViewFilter] = useState('all'); 
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingClub, setEditingClub] = useState(null);
            const [formData, setFormData] = useState({ name: '', teacher: '', capacity: 20, category: 'm_ton' });
            const [isImportingClubs, setIsImportingClubs] = useState(false);
            const clubFileInputRef = useRef(null);

            const clubMemberMap = useMemo(() => {
                const map = {};
                students.forEach(student => {
                    if (!student.clubId) return;
                    map[student.clubId] = (map[student.clubId] || 0) + 1;
                });
                return map;
            }, [students]);

            const filteredClubs = useMemo(() => {
                if (viewFilter === 'all') return clubs;
                return clubs.filter(c => c.category === viewFilter);
            }, [clubs, viewFilter]);

            const handleOpenModal = (club = null) => {
                if (club) {
                    setEditingClub(club);
                    setFormData({ name: club.name, teacher: club.teacher, capacity: club.capacity, category: club.category });
                } else {
                    setEditingClub(null);
                    setFormData({ name: '', teacher: '', capacity: 20, category: viewFilter === 'all' ? 'm_ton' : viewFilter });
                }
                setIsModalOpen(true);
            };

            const handleSave = async (e) => {
                e.preventDefault();
                try {
                    if (editingClub) {
                        await update(ref(db, `clubs/${editingClub.dbKey}`), formData);
                    } else {
                        const newRef = push(ref(db, 'clubs'));
                        await set(newRef, { ...formData, enrolledCount: 0 });
                    }
                    setIsModalOpen(false);
                    Swal.fire({
                        icon: 'success', title: 'สำเร็จ', text: 'บันทึกข้อมูลชุมนุมเสร็จสิ้น',
                        confirmButtonColor: '#3b82f6', customClass: { popup: 'rounded-2xl' }
                    });
                    if (onDataRefresh) onDataRefresh();
                } catch (err) {
                    console.error(err);
                }
            };

            const handleDelete = async (dbKey) => {
                const clubObj = clubs.find(c => c.dbKey === dbKey);
                const enrolled = clubObj ? (clubObj.enrolledCount || 0) : 0;
                
                if (enrolled > 0) {
                    Swal.fire({
                        icon: 'error', title: 'ลบไม่สำเร็จ', text: 'ไม่สามารถลบชุมนุมที่มีนักเรียนลงทะเบียนแล้วได้',
                        confirmButtonColor: '#3b82f6', customClass: { popup: 'rounded-2xl' }
                    });
                    return;
                }
                
                const result = await Swal.fire({
                    title: 'ยืนยันการลบชุมนุม?', text: "คุณต้องการลบข้อมูลชุมนุมนี้ออกจากระบบใช่หรือไม่!",
                    icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444',
                    cancelButtonColor: '#3b82f6', confirmButtonText: 'ยืนยันการลบ', cancelButtonText: 'ยกเลิก',
                    customClass: { popup: 'rounded-2xl' }
                });

                if (result.isConfirmed) {
                    await remove(ref(db, `clubs/${dbKey}`));
                    Swal.fire({
                        icon: 'success', title: 'ลบสำเร็จ', text: 'ลบข้อมูลชุมนุมออกจากระบบแล้ว',
                        confirmButtonColor: '#3b82f6', customClass: { popup: 'rounded-2xl' }
                    });
                    if (onDataRefresh) onDataRefresh();
                }
            };

            // 🌟 1. ปรับปรุงอัปโหลดไฟล์ชุมนุมให้รองรับโครงสร้างใหม่ ม.ปลาย
            const handleClubFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setIsImportingClubs(true);
                try {
                    const XLSX = await loadXLSX();
                    const data = await file.arrayBuffer();
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    let importedCount = 0;
                    const updates = {};

                    for (const sheetName of workbook.SheetNames) {
                        let category = null;
                        if (sheetName.includes('ต้น') || sheetName.toLowerCase().includes('ton')) {
                            category = 'm_ton';
                        } else {
                            category = 'm_plai'; 
                        }

                        const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);
                        for (const rawRow of rows) {
                            const row = {};
                            for (const key in rawRow) {
                                row[key.trim()] = rawRow[key];
                            }

                            const name = row['ชื่อชุมนุม'] || row['ชื่อชุมนุม (สำหรับม.ปลายเท่านั้น)'] || row['ชื่อชุมนุม (สำหรับม.ต้นเท่านั้น)'] || row['name'] || row['Name'] || Object.values(row)[0];
                            const teacher = row['ครูผู้สอน'] || row['ผู้สอน'] || row['teacher'] || row['Teacher'] || Object.values(row)[1];
                            const capacity = row['จำนวนรับ'] || row['จำนวน'] || row['capacity'] || row['Capacity'] || Object.values(row)[2];

                            if (name && String(name).trim() !== "") {
                                const clubName = String(name).trim();
                                const isDuplicate = clubs.some(c => c.name === clubName && c.category === category);
                                
                                if (!isDuplicate) {
                                    const newClubRef = push(ref(db, 'clubs'));
                                    updates[`clubs/${newClubRef.key}`] = {
                                        name: clubName,
                                        teacher: teacher ? String(teacher).trim() : 'ไม่ระบุผู้สอน',
                                        capacity: capacity ? parseInt(capacity) : 20,
                                        category: category,
                                        enrolledCount: 0
                                    };
                                    importedCount++;
                                }
                            }
                        }
                    }

                    if (importedCount > 0) {
                        await update(ref(db), updates);
                        Swal.fire({
                            icon: 'success', title: 'นำเข้าสำเร็จ', text: `นำเข้าข้อมูลชุมนุมใหม่สำเร็จทั้งหมด ${importedCount} รายการ!`,
                            confirmButtonColor: '#10b981', customClass: { popup: 'rounded-2xl' }
                        });
                        if (onDataRefresh) onDataRefresh();
                    } else {
                        Swal.fire({
                            icon: 'info', title: 'ไม่มีข้อมูลใหม่', text: 'ไม่พบชุมนุมใหม่ที่ต้องนำเข้าในไฟล์นี้',
                            confirmButtonColor: '#3b82f6', customClass: { popup: 'rounded-2xl' }
                        });
                    }
                } catch (error) {
                    console.error(error);
                    Swal.fire({
                        icon: 'error', title: 'ผิดพลาด', text: 'เกิดข้อผิดพลาดในการนำเข้าไฟล์',
                        confirmButtonColor: '#ef4444', customClass: { popup: 'rounded-2xl' }
                    });
                } finally {
                    setIsImportingClubs(false);
                    if (clubFileInputRef.current) clubFileInputRef.current.value = '';
                }
            };

            return (
                <div className="animate-in fade-in duration-300">
                    <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-4 sm:mb-6 gap-3 sm:gap-4">
                        <div className="bg-gray-100 p-1 rounded-lg sm:rounded-xl inline-flex w-full lg:w-auto overflow-x-auto custom-scrollbar">
                            <button className={`px-3 sm:px-4 py-1.5 sm:py-2 rounded-md sm:rounded-lg text-[10px] sm:text-sm font-bold transition whitespace-nowrap ${viewFilter === 'all' ? 'bg-white shadow text-blue-600' : 'text-gray-600 hover:text-gray-900'}`} onClick={() => setViewFilter('all')}>ทั้งหมด</button>
                            <button className={`px-3 sm:px-4 py-1.5 sm:py-2 rounded-md sm:rounded-lg text-[10px] sm:text-sm font-bold transition whitespace-nowrap ${viewFilter === 'm_ton' ? 'bg-purple-100 text-purple-700 shadow' : 'text-gray-600 hover:text-gray-900'}`} onClick={() => setViewFilter('m_ton')}>ม.ต้น (1-3)</button>
                            <button className={`px-3 sm:px-4 py-1.5 sm:py-2 rounded-md sm:rounded-lg text-[10px] sm:text-sm font-bold transition whitespace-nowrap ${viewFilter === 'm_plai' ? 'bg-orange-100 text-orange-700 shadow' : 'text-gray-600 hover:text-gray-900'}`} onClick={() => setViewFilter('m_plai')}>ม.ปลาย (4-6)</button>
                        </div>

                        <div className="flex flex-col sm:flex-row gap-2 sm:gap-3 w-full lg:w-auto">
                            <input type="file" accept=".xlsx, .xls" className="hidden" ref={clubFileInputRef} onChange={handleClubFileUpload} />
                            <button onClick={() => clubFileInputRef.current.click()} disabled={isImportingClubs} className="bg-emerald-50 text-emerald-600 border border-emerald-200 hover:bg-emerald-100 px-3 sm:px-4 py-2 sm:py-2.5 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-1.5 sm:gap-2 transition w-full sm:w-auto shadow-sm">
                                <Upload size={16} /> {isImportingClubs ? 'กำลังประมวลผล...' : 'นำเข้าชุมนุม (XLSX)'}
                            </button>
                            <button onClick={() => handleOpenModal()} className="bg-blue-600 hover:bg-blue-700 text-white px-3 sm:px-4 py-2 sm:py-2.5 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-1.5 sm:gap-2 transition shadow-md w-full sm:w-auto">
                                <Plus size={16} /> เพิ่มชุมนุมใหม่
                            </button>
                        </div>
                    </div>

                    <div className="overflow-x-auto rounded-xl sm:rounded-2xl border border-gray-200 shadow-sm max-h-[400px] sm:max-h-[600px] custom-scrollbar w-full">
                        <table className="w-full text-left border-collapse whitespace-nowrap min-w-[600px]">
                            <thead className="sticky top-0 z-10 bg-gray-100">
                                <tr className="text-gray-700 text-[10px] sm:text-sm border-b border-gray-200">
                                    <th className="p-2 sm:p-4 font-bold w-1/3">ชื่อชุมนุม</th>
                                    <th className="p-2 sm:p-4 font-bold text-center">หมวดหมู่</th>
                                    <th className="p-2 sm:p-4 font-bold">ครูผู้สอน</th>
                                    <th className="p-2 sm:p-4 font-bold text-center">จำนวนรับ</th>
                                    <th className="p-2 sm:p-4 font-bold text-center">ลงแล้ว</th>
                                    <th className="p-2 sm:p-4 font-bold text-center">จัดการ</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100 bg-white">
                                {filteredClubs.map(club => {
                                    const enrolled = club.enrolledCount || 0;
                                    return (
                                        <tr key={club.dbKey} className="hover:bg-blue-50/50 transition">
                                            <td className="p-2 sm:p-4 font-medium text-gray-800 text-[10px] sm:text-sm break-words whitespace-normal min-w-[150px] sm:min-w-[200px]">{club.name}</td>
                                            <td className="p-2 sm:p-4 text-center"><span className={`px-1.5 sm:px-2 py-0.5 sm:py-1 rounded text-[9px] sm:text-xs font-bold ${club.category === 'm_ton' ? 'bg-purple-100 text-purple-700' : 'bg-orange-100 text-orange-700'}`}>{club.category === 'm_ton' ? 'ม.ต้น' : 'ม.ปลาย'}</span></td>
                                            <td className="p-2 sm:p-4 text-[10px] sm:text-sm text-gray-600 truncate max-w-[100px] sm:max-w-[150px]">{club.teacher}</td>
                                            <td className="p-2 sm:p-4 text-center text-[10px] sm:text-sm font-medium">{club.capacity}</td>
                                            <td className="p-2 sm:p-4 text-center text-[10px] sm:text-sm font-medium"><span className={`px-1.5 sm:px-2 py-0.5 sm:py-1 rounded-full bg-green-100 text-green-700`}>{enrolled}</span></td>
                                            <td className="p-2 sm:p-4 flex justify-center gap-1 sm:gap-2">
                                                <button onClick={() => handleOpenModal(club)} className="p-1.5 sm:p-2 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded-md sm:rounded-lg transition" title="แก้ไข"><Edit size={14} className="sm:w-4 sm:h-4" /></button>
                                                <button onClick={() => handleDelete(club.dbKey)} className="p-1.5 sm:p-2 bg-red-50 text-red-500 hover:bg-red-100 rounded-md sm:rounded-lg transition" title="ลบ"><Trash2 size={14} className="sm:w-4 sm:h-4" /></button>
                                            </td>
                                        </tr>
                                    );
                                })}
                                {filteredClubs.length === 0 && (
                                    <tr><td colSpan="6" className="p-8 sm:p-12 text-center text-gray-400 font-medium text-xs sm:text-sm">ไม่มีข้อมูลชุมนุมในหมวดหมู่นี้</td></tr>
                                )}
                            </tbody>
                        </table>
                    </div>

                    <Modal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} title={editingClub ? "แก้ไขชุมนุม" : "เพิ่มชุมนุมใหม่"}>
                        <form onSubmit={handleSave} className="space-y-3 sm:space-y-4">
                            <div><label className="block text-xs sm:text-sm font-bold text-gray-700 mb-1">ชื่อชุมนุม</label><input type="text" required value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full p-2.5 sm:p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-xs sm:text-sm" /></div>
                            <div><label className="block text-xs sm:text-sm font-bold text-gray-700 mb-1">ครูผู้สอน</label><input type="text" required value={formData.teacher} onChange={e => setFormData({...formData, teacher: e.target.value})} className="w-full p-2.5 sm:p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-xs sm:text-sm" /></div>
                            <div className="grid grid-cols-2 gap-3 sm:gap-4">
                                <div><label className="block text-xs sm:text-sm font-bold text-gray-700 mb-1">จำนวนรับ</label><input type="number" required min="1" value={formData.capacity} onChange={e => setFormData({...formData, capacity: parseInt(e.target.value)})} className="w-full p-2.5 sm:p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-xs sm:text-sm" /></div>
                                <div><label className="block text-xs sm:text-sm font-bold text-gray-700 mb-1">หมวดหมู่</label><select value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})} className="w-full p-2.5 sm:p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none bg-white text-xs sm:text-sm"><option value="m_ton">ม.ต้น (ม.1-3)</option><option value="m_plai">ม.ปลาย (ม.4-6)</option></select></div>
                            </div>
                            <button type="submit" className="w-full mt-4 sm:mt-6 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 sm:py-3.5 rounded-xl transition shadow-md text-sm sm:text-base">บันทึกข้อมูล</button>
                        </form>
                    </Modal>
                </div>
            );
        }

        // --- ADMIN: CLASSES & STUDENTS ---
        function AdminClasses({ classes, clubs, students, onDataRefresh }) {
            const [selectedClassId, setSelectedClassId] = useState(null);
            const [isImporting, setIsImporting] = useState(false);
            const fileInputRef = useRef(null);

            // 🌟 8. เพิ่มระบบ Indexing สำหรับนักเรียนใหม่: บันทึกข้อมูลลงตาราง index และ members ไปพร้อมกันรวดเดียว
            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setIsImporting(true);
                try {
                    const XLSX = await loadXLSX();
                    const data = await file.arrayBuffer();
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    let createdClassesCount = 0;
                    let createdStudentsCount = 0;
                    const updates = {};
                    
                    for (const sheetName of workbook.SheetNames) {
                        const match = sheetName.match(/ม\.?\s*([1-6])\s*[-/]\s*(\d+)/);
                        if (match) {
                            const grade = parseInt(match[1]);
                            const room = parseInt(match[2]);

                            const existingClass = classes.find(c => c.grade === grade && c.room === room);
                            let classDbKey = null;

                            if (!existingClass) {
                                const newClassRef = push(ref(db, 'classes'));
                                classDbKey = newClassRef.key;
                                updates[`classes/${classDbKey}`] = { grade, room };
                                createdClassesCount++;
                            } else {
                                classDbKey = existingClass.dbKey;
                            }

                            const rawRows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);
                            
                            for (const rawRow of rawRows) {
                                const row = {};
                                for (const key in rawRow) row[key.trim()] = rawRow[key];

                                const rawId = row['รหัสนักเรียน'] || row['student_id'] || row['ID'] || row['รหัส'];
                                const name = row['ชื่อสกุล'] || row['ชื่อ-สกุล'] || row['name'] || row['Name'] || row['ชื่อ'];
                                const number = row['เลขที่'] || row['no'] || row['No.'] || row['เลข'];
                                const gender = row['เพศ'] || row['gender'];

                                if (rawId && name) {
                                    const studentIdStr = String(rawId).trim();
                                    const isDuplicateStudent = students.some(s => s.studentId === studentIdStr);

                                    if (!isDuplicateStudent) {
                                        const plainPassword = generatePassword(); 
                                        const newStudentRef = push(ref(db, 'students'));
                                        const studentDbKey = newStudentRef.key;
                                        
                                        // บันทึกตารางนักเรียน
                                        updates[`students/${studentDbKey}`] = {
                                            studentId: studentIdStr,
                                            name: String(name).trim(),
                                            number: number ? parseInt(number) : '',
                                            gender: gender ? String(gender).trim() : '',
                                            password: plainPassword, 
                                            classId: classDbKey,
                                            clubId: null
                                        };
                                        
                                        // 🌟 บันทึกตารางดัชนี (students_index) เสมอ เพื่อลด Quota ตอน Login
                                        updates[`students_index/${studentIdStr}`] = studentDbKey;

                                        createdStudentsCount++;
                                    }
                                }
                            }
                        }
                    }

                    if (createdClassesCount > 0 || createdStudentsCount > 0) {
                        await update(ref(db), updates);
                        Swal.fire({
                            icon: 'success', title: 'อิมพอร์ตสำเร็จ', text: `สร้าง ${createdClassesCount} ห้องเรียน และ เพิ่ม ${createdStudentsCount} นักเรียนเรียบร้อยแล้ว`,
                            confirmButtonColor: '#10b981', customClass: { popup: 'rounded-2xl' }
                        });
                        if (onDataRefresh) onDataRefresh();
                    } else {
                        Swal.fire({
                            icon: 'info', title: 'ไม่มีข้อมูลใหม่', text: 'ไม่พบห้องเรียนหรือนักเรียนใหม่',
                            confirmButtonColor: '#3b82f6', customClass: { popup: 'rounded-2xl' }
                        });
                    }
                } catch (error) {
                    Swal.fire({
                        icon: 'error', title: 'เกิดข้อผิดพลาด', text: 'เกิดข้อผิดพลาดในการอ่านไฟล์',
                        confirmButtonColor: '#ef4444', customClass: { popup: 'rounded-2xl' }
                    });
                } finally {
                    setIsImporting(false);
                    if (fileInputRef.current) fileInputRef.current.value = '';
                }
            };

            if (!selectedClassId) {
                const sortedClasses = [...classes].sort((a, b) => a.grade === b.grade ? a.room - b.room : a.grade - b.grade);

                return (
                    <div className="animate-in fade-in duration-300">
                        <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-4 sm:mb-6 gap-3 sm:gap-4 border-b border-gray-100 pb-3 sm:pb-4">
                            <div>
                                <h3 className="text-lg sm:text-xl font-bold text-gray-800">รายการห้องเรียน</h3>
                                <p className="text-[10px] sm:text-sm text-gray-500 mt-1">คลิกที่ห้องเรียนเพื่อดูและจัดการนักเรียน</p>
                            </div>
                            
                            <div className="bg-green-50 p-3 sm:p-4 rounded-xl sm:rounded-2xl border border-green-200 w-full lg:w-auto shadow-sm">
                                <h4 className="font-bold text-green-800 mb-1 sm:mb-2 flex items-center gap-1.5 sm:gap-2 text-xs sm:text-sm">
                                    <FileSpreadsheet size={16} className="sm:w-4 sm:h-4"/> สร้างห้องเรียนอัตโนมัติ (XLSX)
                                </h4>
                                <p className="text-[10px] sm:text-xs text-green-700 mb-2 sm:mb-3 max-w-sm">
                                    ชื่อ Sheet ต้องเป็นเช่น "ม.1-1" พร้อมคอลัมน์: เลขที่, รหัสนักเรียน, ชื่อสกุล
                                </p>
                                <input type="file" accept=".xlsx, .xls" className="hidden" ref={fileInputRef} onChange={handleFileUpload} />
                                <button 
                                    onClick={() => fileInputRef.current.click()} disabled={isImporting}
                                    className="w-full bg-green-600 hover:bg-green-700 disabled:bg-green-400 text-white py-2 sm:py-2.5 rounded-lg sm:rounded-xl text-[10px] sm:text-sm font-bold flex justify-center items-center gap-1.5 sm:gap-2 transition shadow-md"
                                >
                                    {isImporting ? 'กำลังประมวลผล...' : <><Upload size={14} className="sm:w-4 sm:h-4" /> อัปโหลดไฟล์ XLSX</>}
                                </button>
                            </div>
                        </div>

                        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 sm:gap-4 max-h-[400px] sm:max-h-[500px] overflow-y-auto custom-scrollbar p-1">
                            {sortedClasses.map(cls => {
                                return (
                                    <div 
                                        key={cls.dbKey}
                                        onClick={() => setSelectedClassId(cls.dbKey)}
                                        className="bg-white border border-gray-200 p-4 sm:p-5 rounded-xl sm:rounded-2xl hover:border-blue-400 hover:shadow-lg cursor-pointer transition transform hover:-translate-y-1 group relative overflow-hidden"
                                    >
                                        <div className="flex justify-between items-center mb-2 sm:mb-3">
                                            <h4 className="text-xl sm:text-2xl font-black text-gray-800 group-hover:text-blue-600 transition tracking-tight">ม.{cls.grade}/{cls.room}</h4>
                                            <ChevronRight className="text-gray-300 group-hover:text-blue-500 transition w-4 h-4 sm:w-5 sm:h-5" />
                                        </div>
                                        <div className="bg-blue-50 inline-flex px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg border border-blue-100">
                                            <p className="text-[10px] sm:text-sm text-blue-800 font-bold flex items-center gap-1 sm:gap-2">
                                                <Users size={12} className="sm:w-3.5 sm:h-3.5"/> จัดการนักเรียน
                                            </p>
                                        </div>
                                    </div>
                                );
                            })}
                            {classes.length === 0 && (
                                <div className="col-span-full text-center py-8 sm:py-12 bg-gray-50 rounded-xl sm:rounded-2xl border border-dashed border-gray-300">
                                    <School className="mx-auto text-gray-300 mb-2 sm:mb-3 w-10 h-10 sm:w-12 sm:h-12" />
                                    <p className="text-gray-500 font-medium text-xs sm:text-sm">ยังไม่มีห้องเรียนในระบบ</p>
                                    <p className="text-[10px] sm:text-xs text-gray-400 mt-1">กรุณาอัปโหลดไฟล์ XLSX เพื่อสร้างข้อมูล</p>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            return (
                <ClassStudentManager 
                    classData={classes.find(c => c.dbKey === selectedClassId)}
                    onBack={() => setSelectedClassId(null)}
                    students={students}
                    clubs={clubs}
                    onDataRefresh={onDataRefresh}
                />
            );
        }

        function ClassStudentManager({ classData, onBack, students, clubs, onDataRefresh }) {
            const classStudents = useMemo(() => {
                return students.filter(s => s.classId === classData?.dbKey);
            }, [students, classData]);
            
            const [editModalOpen, setEditModalOpen] = useState(false);
            const [editingKey, setEditingKey] = useState(null);
            const [editForm, setEditForm] = useState({ number: '', studentId: '', name: '', password: '', clubId: '' });
            
            // 🌟 แก้ไขสถิติ isLoadingStudents ให้เป็นระเบียบเรียบร้อยแล้ว
            const isLoadingStudents = false;

            const handleDownloadClassXLSX = async () => {
                try {
                    const XLSX = await loadXLSX();
                    const exportData = [...classStudents].sort((a,b) => (a.number||0) - (b.number||0)).map(st => {
                        const club = clubs.find(c => c.dbKey === st.clubId);
                        return {
                            'เลขที่': st.number || '',
                            'รหัสประจำตัว': st.studentId || '',
                            'ชื่อ-สกุล': st.name || '',
                            'รหัสผ่าน': st.password || '',
                            'ชุมนุมที่เลือก': club ? club.name : 'ยังไม่เลือก'
                        };
                    });
                    const ws = XLSX.utils.json_to_sheet(exportData);
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, `ม.${classData.grade}-${classData.room}`);
                    XLSX.writeFile(wb, `ข้อมูลนักเรียน_ม.${classData.grade}-${classData.room}.xlsx`);
                } catch(err) {
                    Swal.fire({
                        icon: 'error',
                        title: 'ผิดพลาด',
                        text: 'เกิดข้อผิดพลาดในการดาวน์โหลดไฟล์',
                        confirmButtonColor: '#3b82f6',
                        customClass: { popup: 'rounded-2xl' }
                    });
                }
            };

            const handleDeleteStudent = async (dbKey) => {
                const result = await Swal.fire({
                    title: 'ยืนยันการลบนักเรียน?',
                    text: "คุณต้องการลบนักเรียนรายนี้ออกจากระบบใช่หรือไม่!",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#ef4444',
                    cancelButtonColor: '#3b82f6',
                    confirmButtonText: 'ยืนยันการลบ',
                    cancelButtonText: 'ยกเลิก',
                    customClass: { popup: 'rounded-2xl' }
                });

                if (result.isConfirmed) {
                    try {
                        const studentObj = classStudents.find(s => s.dbKey === dbKey);
                        const updates = {};
                        
                        // ลบประวัตินักเรียนในฐานระบบ
                        updates[`students/${dbKey}`] = null;
                        
                        if (studentObj) {
                            const studentIdStr = String(studentObj.studentId).trim();
                            // ลบข้อมูล Index
                            updates[`students_index/${studentIdStr}`] = null;

                            // 🌟 หักยอดและประวัตินักเรียนออกจากตารางประวัติ club_members ไปพร้อมกันทันที
                            if (studentObj.clubId) {
                                updates[`club_members/${studentObj.clubId}/${studentIdStr}`] = null;
                                
                                await runTransaction(ref(db, `clubs/${studentObj.clubId}/enrolledCount`), (count) => {
                                    return Math.max(0, (count || 0) - 1);
                                });
                            }
                        }

                        await update(ref(db), updates);

                        Swal.fire({
                            icon: 'success',
                            title: 'ลบสำเร็จ',
                            text: 'ลบนักเรียนออกจากระบบแล้ว',
                            confirmButtonColor: '#3b82f6',
                            customClass: { popup: 'rounded-2xl' }
                        });
                        if (onDataRefresh) await onDataRefresh();
                    } catch (error) {
                        console.error(error);
                        Swal.fire({
                            icon: 'error',
                            title: 'เกิดข้อผิดพลาด',
                            text: 'ไม่สามารถลบข้อมูลนักเรียนได้',
                            confirmButtonColor: '#ef4444',
                            customClass: { popup: 'rounded-2xl' }
                        });
                    }
                }
            };

            const handleEditOpen = (student) => {
                setEditingKey(student.dbKey);
                setEditForm({
                    number: student.number || '',
                    studentId: student.studentId || '',
                    name: student.name || '',
                    password: student.password || '',
                    clubId: student.clubId || ''
                });
                setEditModalOpen(true);
            };

            const handleEditSave = async (e) => {
                e.preventDefault();
                if(editingKey) {
                    try {
                        const studentObj = classStudents.find(s => s.dbKey === editingKey);
                        if (!studentObj) throw "ไม่พบบัญชีรายชื่อนักเรียน";

                        const oldClubId = studentObj.clubId;
                        const newClubId = editForm.clubId;

                        const oldStudentIdStr = String(studentObj.studentId).trim();
                        const newStudentIdStr = String(editForm.studentId).trim();

                        if (oldClubId !== newClubId) {
                            if (oldClubId) {
                                await runTransaction(ref(db, `clubs/${oldClubId}/enrolledCount`), (count) => Math.max(0, (count || 0) - 1));
                            }
                            if (newClubId) {
                                await runTransaction(ref(db, `clubs/${newClubId}/enrolledCount`), (count) => (count || 0) + 1);
                            }
                        }

                        const updates = {};
                        
                        // อัปเดตตารางหลักนักเรียน
                        updates[`students/${editingKey}`] = {
                            studentId: newStudentIdStr,
                            name: String(editForm.name).trim(),
                            number: editForm.number ? parseInt(editForm.number) : '',
                            password: editForm.password,
                            classId: classData.dbKey,
                            clubId: newClubId || null
                        };

                        // หากมีการสลับรหัสนักเรียน ให้ลบดัชนีเก่าแล้วสร้างอันใหม่
                        if (oldStudentIdStr !== newStudentIdStr) {
                            updates[`students_index/${oldStudentIdStr}`] = null;
                        }
                        updates[`students_index/${newStudentIdStr}`] = editingKey;

                        // 🌟 จัดระบบประวัติ club_members สมาชิกชุมนุม
                        if (oldClubId) {
                            updates[`club_members/${oldClubId}/${oldStudentIdStr}`] = null;
                        }
                        if (newClubId) {
                            updates[`club_members/${newClubId}/${newStudentIdStr}`] = {
                                dbKey: editingKey,
                                name: String(editForm.name).trim(),
                                gender: studentObj.gender || '',
                                studentId: newStudentIdStr
                            };
                        }

                        await update(ref(db), updates);

                        setEditModalOpen(false);
                        Swal.fire({
                            icon: 'success',
                            title: 'สำเร็จ',
                            text: 'แก้ไขข้อมูลนักเรียนเสร็จสิ้น',
                            confirmButtonColor: '#3b82f6',
                            customClass: { popup: 'rounded-2xl' }
                        });
                        if (onDataRefresh) await onDataRefresh();
                    } catch (err) {
                        console.error(err);
                        Swal.fire({
                            icon: 'error',
                            title: 'ผิดพลาด',
                            text: typeof err === 'string' ? err : 'เกิดข้อผิดพลาดในการบันทึกข้อมูล',
                            confirmButtonColor: '#ef4444',
                            customClass: { popup: 'rounded-2xl' }
                        });
                    }
                }
            };

            if(!classData) return null;

            return (
                <div className="space-y-4 sm:space-y-6 animate-in slide-in-from-right-4 duration-300">
                    <div className="flex flex-wrap items-center justify-between border-b border-gray-100 pb-3 sm:pb-4 gap-2">
                        <div className="flex items-center gap-2 sm:gap-4">
                            <button onClick={onBack} className="p-1.5 sm:p-2.5 bg-gray-50 border border-gray-200 hover:bg-white hover:shadow-sm text-gray-700 rounded-lg sm:rounded-xl transition"><ChevronRight className="rotate-180 w-4 h-4 sm:w-5 sm:h-5" /></button>
                            <div>
                                <h2 className="text-xl sm:text-2xl font-black text-gray-800 tracking-tight">ม.{classData.grade}/{classData.room}</h2>
                                <p className="text-[10px] sm:text-sm text-gray-500 font-medium mt-0.5 sm:mt-1">รายชื่อนักเรียน ({classStudents.length} คน)</p>
                            </div>
                        </div>
                        <button onClick={handleDownloadClassXLSX} className="bg-green-600 hover:bg-green-700 text-white px-3 sm:px-4 py-2 sm:py-2.5 rounded-xl text-[10px] sm:text-sm font-bold flex items-center gap-1.5 sm:gap-2 transition shadow-sm"><Download size={14} className="sm:w-4 sm:h-4" /> ดาวน์โหลดรหัสผ่านและรายชื่อ</button>
                    </div>

                    <div className="bg-white border border-gray-200 rounded-xl sm:rounded-2xl overflow-hidden shadow-sm">
                        <div className="overflow-x-auto max-h-[450px] sm:max-h-[500px] custom-scrollbar w-full">
                            <table className="w-full text-left text-[10px] sm:text-sm whitespace-nowrap min-w-[500px]">
                                <thead className="bg-gray-50 sticky top-0 shadow-sm z-10 border-b border-gray-200">
                                    <tr>
                                        <th className="p-2 sm:p-4 font-bold text-gray-600 w-10 sm:w-16">เลขที่</th>
                                        <th className="p-2 sm:p-4 font-bold text-gray-600">รหัสนักเรียน</th>
                                        <th className="p-2 sm:p-4 font-bold text-gray-600">ชื่อ-สกุล</th>
                                        <th className="p-2 sm:p-4 font-bold text-gray-600 text-center">รหัสผ่าน</th>
                                        <th className="p-2 sm:p-4 font-bold text-gray-600">ชุมนุม</th>
                                        <th className="p-2 sm:p-4 font-bold text-gray-600 text-center">จัดการ</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-100">
                                    {isLoadingStudents ? (
                                        <tr><td colSpan="6" className="p-10 text-center text-gray-400 font-medium">กำลังโหลดข้อมูล...</td></tr>
                                    ) : classStudents.sort((a,b) => (a.number||0) - (b.number||0)).map(student => {
                                        const club = clubs.find(c => c.dbKey === student.clubId);
                                        return (
                                            <tr key={student.dbKey} className="hover:bg-blue-50/30 transition">
                                                <td className="p-2 sm:p-4 font-medium text-gray-500 text-center">{student.number}</td>
                                                <td className="p-2 sm:p-4 font-bold text-gray-800">{student.studentId}</td>
                                                <td className="p-2 sm:p-4 text-gray-700 truncate max-w-[120px] sm:max-w-none">{student.name}</td>
                                                <td className="p-2 sm:p-4 text-center">
                                                    <span className="text-blue-600 font-mono tracking-widest text-[9px] sm:text-xs bg-blue-50 px-1.5 sm:px-2 py-0.5 sm:py-1 rounded border border-blue-100">{student.password}</span>
                                                </td>
                                                <td className="p-2 sm:p-4">
                                                    {student.clubId ? (
                                                        <span className="bg-green-50 text-green-700 border border-green-200 font-bold px-2 sm:px-3 py-0.5 sm:py-1 rounded-md sm:rounded-lg truncate max-w-[100px] sm:max-w-[200px] inline-block text-[9px] sm:text-xs" title={club?.name}>{club?.name || 'ไม่ทราบ'}</span>
                                                    ) : (
                                                        <span className="bg-gray-100 text-gray-500 font-medium px-2 sm:px-3 py-0.5 sm:py-1 rounded-md sm:rounded-lg text-[9px] sm:text-xs">ยังไม่เลือก</span>
                                                    )}
                                                </td>
                                                <td className="p-2 sm:p-4 flex justify-center gap-1 sm:gap-2">
                                                    <button onClick={() => handleEditOpen(student)} className="text-blue-500 hover:bg-blue-50/50 p-1 sm:p-1.5 rounded-md sm:rounded-lg border border-transparent hover:border-blue-200 transition" title="แก้ไขข้อมูลนักเรียน"><Edit size={14} className="sm:w-4 sm:h-4" /></button>
                                                    <button onClick={() => handleDeleteStudent(student.dbKey)} className="text-red-500 hover:bg-red-50 p-1 sm:p-1.5 rounded-md sm:rounded-lg border border-transparent hover:border-red-200 transition" title="ลบนักเรียน"><Trash2 size={14} className="sm:w-4 sm:h-4" /></button>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                    {classStudents.length === 0 && (
                                        <tr><td colSpan="6" className="p-8 sm:p-12 text-center text-gray-400 font-medium text-xs sm:text-sm">ยังไม่มีนักเรียนในห้องนี้</td></tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <Modal isOpen={editModalOpen} onClose={() => setEditModalOpen(false)} title="แก้ไขข้อมูลนักเรียน">
                        <form onSubmit={handleEditSave} className="space-y-3 sm:space-y-4">
                            <div className="grid grid-cols-2 gap-3 sm:gap-4">
                                <div><label className="block text-xs sm:text-sm font-bold text-gray-700 mb-1">เลขที่</label><input type="number" required value={editForm.number} onChange={e => setEditForm({...editForm, number: e.target.value})} className="w-full p-2.5 sm:p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-xs sm:text-sm" /></div>
                                <div><label className="block text-xs sm:text-sm font-bold text-gray-700 mb-1">รหัสประจำตัว</label><input type="text" required value={editForm.studentId} onChange={e => setEditForm({...editForm, studentId: e.target.value})} className="w-full p-2.5 sm:p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-xs sm:text-sm" /></div>
                            </div>
                            <div><label className="block text-xs sm:text-sm font-bold text-gray-700 mb-1">ชื่อ-สกุล</label><input type="text" required value={editForm.name} onChange={e => setEditForm({...editForm, name: e.target.value})} className="w-full p-2.5 sm:p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-xs sm:text-sm" /></div>
                            <div><label className="block text-xs sm:text-sm font-bold text-gray-700 mb-1">รหัสผ่าน (สามารถแก้ไขได้)</label><input type="text" required value={editForm.password} onChange={e => setEditForm({...editForm, password: e.target.value})} className="w-full p-2.5 sm:p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-xs sm:text-sm font-mono text-blue-600 bg-blue-50" /></div>
                            <div>
                                <label className="block text-xs sm:text-sm font-bold text-gray-700 mb-1">ชุมนุม</label>
                                <select value={editForm.clubId} onChange={e => setEditForm({...editForm, clubId: e.target.value})} className="w-full p-2.5 sm:p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none bg-white text-xs sm:text-sm">
                                    <option value="">-- ยังไม่เลือกชุมนุม --</option>
                                    {clubs.map(club => (<option key={club.dbKey} value={club.dbKey}>[{club.category === 'm_ton' ? 'ม.ต้น' : 'ม.ปลาย'}] {club.name} ({club.enrolledCount || 0}/{club.capacity})</option>))}
                                </select>
                            </div>
                            <button type="submit" className="w-full mt-4 sm:mt-6 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 sm:py-3.5 rounded-xl transition shadow-md text-sm sm:text-base"><Save size={18} /> บันทึกข้อมูล</button>
                        </form>
                    </Modal>
                </div>
            );
        }

        // --- RENDER REACT ---
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
