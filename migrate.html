<body class="bg-slate-50 text-gray-800">

    <!-- โค้ดระบบหลัก (React + JavaScript) -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useRef, useCallback } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Users, UserPlus, BookOpen, LogOut, CheckCircle, 
            XCircle, AlertTriangle, Plus, Edit, Trash2, 
            Search, ChevronRight, Upload, School, Home,
            FileSpreadsheet, ShieldCheck, Save, Download,
            FileText, Filter, Calendar, Clock, LayoutGrid,
            Settings, Lock, Unlock, RefreshCw
        } from 'lucide-react';

        import { 
            getFirestore, collection, doc, query, where, getDocs, getDoc, 
            addDoc, updateDoc, deleteDoc, setDoc, runTransaction, onSnapshot, writeBatch, increment
        } from "firebase/firestore";

        // --- FIREBASE SETUP ---
        const firebaseConfig = {
            apiKey: "AIzaSyB-KZnV5ML61_s5RNrhVcZUIsT6B4bkgt4",
            authDomain: "fix-problem-c072e.firebaseapp.com",
            projectId: "fix-problem-c072e",
            storageBucket: "fix-problem-c072e.firebasestorage.app",
            messagingSenderId: "528343704190",
            appId: "1:528343704190:web:4b7cd38e6397894ade2e2f",
            measurementId: "G-T0ZSPGL9JG"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const formatDate = (isoString) => {
            if (!isoString) return 'ไม่ได้ระบุเวลา';
            const date = new Date(isoString);
            return date.toLocaleString('th-TH', { 
                year: 'numeric', month: 'long', day: 'numeric', 
                hour: '2-digit', minute: '2-digit'
            }) + ' น.';
        };

        // --- COMPONENTS ---
        const Modal = ({ isOpen, onClose, title, children, maxWidth = "max-w-md" }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-2 sm:p-4 bg-black/50 backdrop-blur-sm animate-in fade-in duration-200">
                    <div className={`bg-white rounded-2xl shadow-2xl w-[95%] sm:w-full ${maxWidth} overflow-hidden flex flex-col max-h-[90vh]`}>
                        <div className="px-4 sm:px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                            <h3 className="text-base sm:text-lg font-bold text-gray-800 truncate pr-2">{title}</h3>
                            <button onClick={onClose} className="text-gray-400 hover:text-red-500 transition shrink-0">
                                <XCircle size={24} />
                            </button>
                        </div>
                        <div className="p-4 sm:p-6 overflow-y-auto custom-scrollbar flex-1">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        const Breadcrumb = ({ paths }) => (
            <nav className="flex text-xs sm:text-sm text-gray-500 font-medium mb-4 sm:mb-6 overflow-x-auto whitespace-nowrap custom-scrollbar pb-1">
                <ol className="inline-flex items-center space-x-1 sm:space-x-3">
                    <li className="inline-flex items-center">
                        <Home size={14} className="mr-1 sm:mr-2 text-gray-400" />
                        {paths[0]}
                    </li>
                    {paths.slice(1).map((path, index) => (
                        <li key={index}>
                            <div className="flex items-center">
                                <ChevronRight size={14} className="text-gray-400 mx-0.5 sm:mx-1" />
                                <span className={index === paths.length - 2 ? "text-gray-800 font-bold" : "text-gray-500 hover:text-gray-700 cursor-pointer"}>
                                    {path}
                                </span>
                            </div>
                        </li>
                    ))}
                </ol>
            </nav>
        );

        // --- MAIN APP ---
        function App() {
            const [user, setUser] = useState(null); 
            const [loginId, setLoginId] = useState('');
            const [loginError, setLoginError] = useState('');
            const [isLoggingIn, setIsLoggingIn] = useState(false);
            const [isLoading, setIsLoading] = useState(true);

            useEffect(() => {
                document.title = "SK CLUB";
                setIsLoading(false);
            }, []);

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoginError('');
                setIsLoggingIn(true);

                try {
                    const cleanLoginId = loginId.trim();
                    if (cleanLoginId.toLowerCase() === 'teacher') {
                        const { value: adminPass } = await Swal.fire({
                            title: 'กรุณากรอกรหัสผ่านผู้ดูแลระบบ',
                            input: 'password',
                            inputPlaceholder: 'รหัสผ่าน',
                            showCancelButton: true,
                            confirmButtonText: 'เข้าสู่ระบบ',
                            cancelButtonText: 'ยกเลิก',
                            confirmButtonColor: '#3b82f6',
                            customClass: { popup: 'rounded-2xl' }
                        });

                        if (adminPass === 'admin2') {
                            setUser({ role: 'admin' });
                        } else if (adminPass !== undefined) {
                            setLoginError('รหัสผ่านผู้ดูแลระบบไม่ถูกต้อง');
                        }
                    } else {
                        // OPTIMIZED READ: Query ONLY the logged-in student. No full-table load.
                        const q = query(collection(db, 'students'), where('studentId', '==', cleanLoginId));
                        const snapshot = await getDocs(q);
                        
                        if (!snapshot.empty) {
                            const studentDoc = snapshot.docs[0];
                            setUser({ role: 'student', dbKey: studentDoc.id, ...studentDoc.data() });
                        } else {
                            setLoginError('ไม่พบข้อมูลรหัสนักเรียนนี้ในระบบ');
                        }
                    }
                } catch (error) {
                    console.error(error);
                    setLoginError('เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์');
                } finally {
                    setIsLoggingIn(false);
                }
            };

            const handleLogout = () => {
                setUser(null);
                setLoginId('');
            };

            if (isLoading) {
                return <div className="min-h-screen flex items-center justify-center bg-gray-50 text-blue-600 font-bold text-lg sm:text-xl p-4 text-center">กำลังโหลดข้อมูล SK CLUB...</div>;
            }

            if (!user) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-3 sm:p-4">
                        <div className="bg-white p-6 sm:p-8 rounded-3xl shadow-xl w-full max-w-md animate-in slide-in-from-bottom-4 duration-500 min-w-[300px]">
                            <div className="text-center mb-6 sm:mb-8">
                                <div className="bg-blue-600 w-14 h-14 sm:w-16 sm:h-16 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-200">
                                    <School className="text-white w-7 h-7 sm:w-8 sm:h-8" />
                                </div>
                                <h1 className="text-xl sm:text-2xl font-bold text-gray-800">SK CLUB</h1>
                                <p className="text-gray-500 mt-1 sm:mt-2 text-xs sm:text-sm font-medium font-prompt">กรุณาป้อนรหัสนักเรียนเข้าสู่ระบบ</p>
                            </div>

                            <form onSubmit={handleLogin} className="space-y-4 sm:space-y-5">
                                <div>
                                    <label className="block text-xs sm:text-sm font-bold text-gray-700 mb-2">รหัสประจำตัวนักเรียน</label>
                                    <input 
                                        type="text" 
                                        className="w-full px-4 sm:px-5 py-3 sm:py-3.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition outline-none text-sm sm:text-base font-medium"
                                        placeholder="กรอกรหัสนักเรียนของคุณ"
                                        value={loginId}
                                        onChange={e => setLoginId(e.target.value)}
                                        required
                                    />
                                </div>
                                {loginError && <p className="text-red-500 text-xs sm:text-sm flex items-center gap-1"><AlertTriangle size={14}/> {loginError}</p>}
                                <button 
                                    type="submit" 
                                    disabled={isLoggingIn}
                                    className="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-blue-400 text-white font-bold py-3 sm:py-3.5 rounded-xl transition shadow-md flex justify-center items-center gap-2 text-sm sm:text-base mt-2"
                                >
                                    {isLoggingIn ? 'กำลังตรวจสอบ...' : <><ShieldCheck size={18} className="sm:w-5 sm:h-5"/> เข้าสู่ระบบ</>}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-slate-50 font-sans min-w-[320px]">
                    <nav className="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-30">
                        <div className="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
                            <div className="flex justify-between h-14 sm:h-16 items-center">
                                <div className="flex items-center space-x-2 sm:space-x-3">
                                    <School className="text-blue-600 w-6 h-6 sm:w-7 sm:h-7" />
                                    <span className="font-bold text-lg sm:text-xl text-gray-800 tracking-tight line-clamp-1">SK CLUB</span>
                                </div>
                                <div className="flex items-center space-x-2 sm:space-x-4">
                                    <div className="text-right flex flex-col justify-center">
                                        <p className="text-[10px] sm:text-sm font-bold text-gray-800 leading-tight">
                                            {user.role === 'admin' ? 'ผู้ดูแลระบบ' : user.name}
                                        </p>
                                        {user.role === 'student' && (
                                            <p className="text-[10px] sm:text-xs text-gray-500 leading-tight hidden sm:block">รหัส: {user.studentId}</p>
                                        )}
                                    </div>
                                    <button 
                                        onClick={handleLogout}
                                        className="p-1.5 sm:p-2 text-gray-500 hover:text-red-600 hover:bg-red-50 rounded-full transition"
                                        title="ออกจากระบบ"
                                    >
                                        <LogOut size={18} className="sm:w-5 sm:h-5" />
                                    </button>
                                </div>
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-6">
                        {user.role === 'student' ? (
                            <StudentDashboard user={user} />
                        ) : (
                            <AdminDashboard />
                        )}
                    </main>
                </div>
            );
        }

        // ==========================================
        // STUDENT DASHBOARD
        // ==========================================
        function StudentDashboard({ user }) {
            const [clubs, setClubs] = useState([]);
            const [classes, setClasses] = useState([]);
            const [sysSettings, setSysSettings] = useState({ isOpen: false, startTime: '', endTime: '' });
            const [studentData, setStudentData] = useState(user);
            const [isLoading, setIsLoading] = useState(true);

            const [selectedClubId, setSelectedClubId] = useState(null);
            const [isConfirmOpen, setIsConfirmOpen] = useState(false);
            const [currentTime, setCurrentTime] = useState(new Date());
            const [isRefreshing, setIsRefreshing] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);

            // 🌟 2. ดึงข้อมูลครั้งเดียวผ่าน getDocs สำหรับนักเรียน (Student) เพื่อประหยัด Quota Reads มหาศาล
            const fetchClubsAndClassesOnce = async () => {
                try {
                    const clubSnap = await getDocs(collection(db, 'clubs'));
                    setClubs(clubSnap.docs.map(doc => ({ dbKey: doc.id, ...doc.data() })));
                    
                    const classSnap = await getDocs(collection(db, 'classes'));
                    setClasses(classSnap.docs.map(doc => ({ dbKey: doc.id, ...doc.data() })));
                } catch (err) {
                    console.error("Error fetching clubs/classes: ", err);
                }
            };

            useEffect(() => {
                // 🌟 ดึงข้อมูลครั้งแรกของแอปพลิเคชัน
                fetchClubsAndClassesOnce().then(() => {
                    setIsLoading(false);
                });

                // 🌟 โหลดเวลาเปิด-ปิดและข้อมูลส่วนตัวเด็กแบบ realtime
                const unsubSettings = onSnapshot(doc(db, 'settings', 'main'), (snap) => {
                    if (snap.exists()) setSysSettings(snap.data());
                });

                const unsubMe = onSnapshot(doc(db, 'students', user.dbKey), (snap) => {
                    if (snap.exists()) setStudentData({ dbKey: snap.id, ...snap.data() });
                });

                return () => {
                    unsubSettings();
                    unsubMe();
                };
            }, [user.dbKey]);

            // Timer for schedule
            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            const studentClass = classes.find(c => c.dbKey === studentData.classId);
            const grade = studentClass ? studentClass.grade : 1;
            const category = grade <= 3 ? 'm_ton' : 'm_plai';

            const availableClubs = clubs.filter(c => c.category === category);
            const userCurrentClub = clubs.find(c => c.dbKey === studentData.clubId);

            const startTime = sysSettings?.startTime ? new Date(sysSettings.startTime) : null;
            const endTime = sysSettings?.endTime ? new Date(sysSettings.endTime) : null;
            let isTimeValid = false;
            if (startTime) {
                if (endTime) {
                    isTimeValid = currentTime >= startTime && currentTime <= endTime;
                } else {
                    isTimeValid = currentTime >= startTime;
                }
            }
            const isSystemOpen = sysSettings?.isOpen || isTimeValid;

            const handleSoftReload = async () => {
                setIsRefreshing(true);
                await fetchClubsAndClassesOnce();
                setIsRefreshing(false);
            };

            const handleJoinClick = (clubKey) => {
                setSelectedClubId(clubKey);
                setIsConfirmOpen(true);
            };

            // 🌟 3. ปรับปรุงฟังก์ชัน confirmJoin ให้ปลอดภัย 100% ด้วยสถาปัตยกรรม Atomic Transaction
            const confirmJoin = async () => {
                if (isSubmitting) return;
                setIsSubmitting(true);

                if (!isSystemOpen) {
                    Swal.fire({
                        icon: 'error',
                        title: 'ปิดรับสมัคร',
                        text: 'ระบบลงทะเบียนปิดการใช้งานอยู่ในขณะนี้',
                        confirmButtonColor: '#3b82f6',
                        customClass: { popup: 'rounded-2xl' }
                    });
                    setIsConfirmOpen(false);
                    setIsSubmitting(false);
                    return;
                }

                try {
                    const studentRef = doc(db, 'students', studentData.dbKey);
                    const clubRef = doc(db, 'clubs', selectedClubId);

                    await runTransaction(db, async (transaction) => {
                        // ขั้นที่ 1: ดึงข้อมูลเอกสารชุมนุมชิ้นที่เลือก ขึ้นมาจากฐานข้อมูลจริง
                        const clubDoc = await transaction.get(clubRef);
                        if (!clubDoc.exists()) throw "ไม่พบข้อมูลชุมนุม";

                        const cData = clubDoc.data();
                        const currentEnrolled = cData.enrolledCount || 0;

                        // ขั้นที่ 2: เช็คความจุจากฐานข้อมูลจริงทันที
                        if (currentEnrolled >= cData.capacity) {
                            throw "ชุมนุมนี้เต็มจำนวนที่รับแล้ว กรุณาเลือกชุมนุมอื่น";
                        }

                        // ขั้นที่ 3: ดึงเอกสารนักเรียนคนนั้นขึ้นมาตรวจเช็ค
                        const studentDoc = await transaction.get(studentRef);
                        if (!studentDoc.exists()) throw "ไม่พบบัญชีรายชื่อของคุณ";

                        const sData = studentDoc.data();
                        if (sData.clubId) {
                            throw "คุณได้ลงสมัครชุมนุมอื่นไปแล้ว ไม่สามารถเลือกซ้ำได้";
                        }

                        // ขั้นที่ 4: หากผ่านเงื่อนไขทั้งหมด ให้สั่งอัปเดตข้อมูลพร้อมกันแบบมัดรวม (Atomic Update)
                        transaction.update(studentRef, { 
                            clubId: selectedClubId,
                            joinedAt: new Date().toISOString()
                        });
                        transaction.update(clubRef, { 
                            enrolledCount: currentEnrolled + 1 
                        });
                    });

                    setIsConfirmOpen(false);
                    setSelectedClubId(null);

                    Swal.fire({
                        icon: 'success',
                        title: 'สำเร็จ',
                        text: 'ลงทะเบียนสมัครเข้าชุมนุมสำเร็จเรียบร้อยแล้ว',
                        confirmButtonColor: '#10b981',
                        customClass: { popup: 'rounded-2xl' }
                    });
                } catch (error) {
                    Swal.fire({
                        icon: 'error',
                        title: 'เกิดข้อผิดพลาด',
                        text: typeof error === 'string' ? error : 'เกิดข้อผิดพลาดในการลงทะเบียน กรุณาลองใหม่อีกครั้ง',
                        confirmButtonColor: '#3b82f6',
                        customClass: { popup: 'rounded-2xl' }
                    }).then(() => {
                        // 🌟 เมื่อเกิด Error ให้ดึงข้อมูลชุมนุมรอบใหม่ทันที เพื่อเปลี่ยนสถานะปุ่มในหน้าจออัตโนมัติ
                        fetchClubsAndClassesOnce();
                    });
                } finally {
                    setIsSubmitting(false);
                }
            };

            if (isLoading) {
                return <div className="text-center py-10 text-gray-500 font-bold">กำลังตรวจสอบข้อมูลนักเรียน...</div>;
            }

            if (studentData.clubId && userCurrentClub) {
                return (
                    <div className="space-y-4 sm:space-y-6 animate-in zoom-in-95 duration-500">
                        <Breadcrumb paths={['หน้าหลัก', 'สถานะการลงทะเบียน']} />
                        
                        <div className="bg-white rounded-3xl p-6 sm:p-10 shadow-lg border border-green-100 flex flex-col items-center text-center relative overflow-hidden">
                            <div className="absolute top-0 left-0 right-0 h-3 bg-green-500"></div>
                            
                            <div className="bg-green-100 text-green-600 p-4 rounded-full mb-6 mt-4 ring-8 ring-green-50">
                                <CheckCircle size={64} className="sm:w-20 sm:h-20" />
                            </div>
                            
                            <h2 className="text-2xl sm:text-3xl font-black text-gray-800 mb-2">ลงทะเบียนสำเร็จ!</h2>
                            <p className="text-gray-500 mb-8 text-sm sm:text-base">คุณได้เป็นส่วนหนึ่งของชุมนุมนี้เรียบร้อยแล้ว ไม่สามารถเปลี่ยนแปลงได้</p>
                            
                            <div className="w-full max-w-2xl bg-gray-50 rounded-2xl p-6 sm:p-8 border border-gray-100 space-y-4 sm:space-y-6 text-left">
                                <div>
                                    <p className="text-xs sm:text-sm font-bold text-gray-400 uppercase tracking-widest mb-1">ชุมนุมที่เลือก</p>
                                    <h3 className="text-xl sm:text-2xl font-bold text-blue-700">{userCurrentClub.name}</h3>
                                </div>
                                
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-4 border-t border-gray-200">
                                    <div className="flex items-start gap-3">
                                        <Users className="text-gray-400 mt-0.5" size={20} />
                                        <div>
                                            <p className="text-xs text-gray-500 font-medium">ครูผู้สอน</p>
                                            <p className="font-bold text-gray-800 text-sm sm:text-base">{userCurrentClub.teacher}</p>
                                        </div>
                                    </div>
                                    <div className="flex items-start gap-3">
                                        <School className="text-gray-400 mt-0.5" size={20} />
                                        <div>
                                            <p className="text-xs text-gray-500 font-medium">ระดับชั้น</p>
                                            <p className="font-bold text-gray-800 text-sm sm:text-base">
                                                {category === 'm_ton' ? 'มัธยมศึกษาตอนต้น' : 'มัธยมศึกษาตอนปลาย'}
                                            </p>
                                        </div>
                                    </div>
                                    <div className="flex items-start gap-3 sm:col-span-2 bg-white p-3 sm:p-4 rounded-xl border border-gray-100 shadow-sm mt-2">
                                        <Clock className="text-blue-500 mt-0.5 shrink-0" size={20} />
                                        <div>

        // 🌟 ClubCard
        function ClubCard({ club, memberCount, isFull, userHasClub, onJoin, students, isStudentSide }) {
            const [isDetailOpen, setIsDetailOpen] = useState(false);
            const [members, setMembers] = useState([]);
            const [isLoadingMembers, setIsLoadingMembers] = useState(false);

            useEffect(() => {
                if (isDetailOpen) {
                    setIsLoadingMembers(true);
                    if (isStudentSide) {
                        // นักเรียนดึงเฉพาะสมาชิกระดับ API ครั้งเดียวเพื่อแสดงผลตอนเปิด
                        const q = query(collection(db, 'students'), where('clubId', '==', club.dbKey));
                        getDocs(q).then((snap) => {
                            setMembers(snap.docs.map(d => d.data()));
                            setIsLoadingMembers(false);
                        }).catch(err => {
                            console.error(err);
                            setIsLoadingMembers(false);
                        });
                    } else if (students) {
                        // แอดมินใช้ Cache จาก students ใน state หลัก
                        setMembers(students.filter(s => s.clubId === club.dbKey));
                        setIsLoadingMembers(false);

                cardClass = "bg-gray-100 text-gray-400 shadow-sm opacity-90 cursor-not-allowed";
                btnClass = "bg-gray-200 text-gray-500 cursor-not-allowed";
                numberColor = "text-gray-500";

            return (
                <>
                    <div

                        className={`rounded-2xl p-4 sm:p-6 transition-all duration-300 flex flex-col justify-between gap-4 border-0 relative overflow-hidden ${cardClass}`}
                    >
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 w-full">
                            <div className="flex-1 min-w-0">
                                <h4 className="text-sm sm:text-base font-bold leading-tight line-clamp-2 break-words mb-2">{club.name}</h4>
                                <div className="flex items-baseline gap-1">
                                    <span className={`text-2xl sm:text-3xl font-black ${numberColor}`}>{memberCount}</span>

                                </div>
                            </div>
                            
                            <button 
                                className={`px-4 py-2 rounded-xl font-bold transition whitespace-nowrap text-xs sm:text-sm shrink-0 self-stretch sm:self-center flex items-center justify-center shadow-sm ${btnClass}`}
                                onClick={(e) => {
                                    e.stopPropagation();
                                    if (!userHasClub && !isFull) onJoin();
                                    else setIsDetailOpen(true);
                                }}
                                disabled={userHasClub || isFull}
                            >
                                {isFull ? 'เต็มแล้ว' : 'เข้าร่วมชุมนุม'}
                            </button>
                        </div>
                    </div>

                    <Modal isOpen={isDetailOpen} onClose={() => setIsDetailOpen(false)} title="รายละเอียดชุมนุม">
                        <div className="space-y-4 sm:space-y-6">
                            <div>
                                <div className="flex gap-2 mb-2 sm:mb-3">
                                    <span className={`px-2 py-1 rounded text-[10px] sm:text-xs font-bold ${club.category === 'm_ton' ? 'bg-purple-100 text-purple-700' : 'bg-orange-100 text-orange-700'}`}>
                                        {club.category === 'm_ton' ? 'มัธยมศึกษาตอนต้น' : 'มัธยมศึกษาตอนปลาย'}
                                    </span>
                                </div>
                                <h3 className="text-lg sm:text-2xl font-bold text-gray-800 mb-3 sm:mb-4 break-words">{club.name}</h3>
                                
                                <div className="grid grid-cols-2 gap-2 sm:gap-4 mb-3 sm:mb-4">
                                    <div className="bg-gray-50 p-2.5 sm:p-3 rounded-xl border border-gray-100 flex flex-col justify-center">
                                        <p className="text-[10px] sm:text-xs text-gray-500 font-bold mb-0.5 sm:mb-1">ครูผู้สอน</p>
                                        <p className="text-xs sm:text-sm font-bold text-gray-800 line-clamp-2">{club.teacher}</p>
                                    </div>
                                    <div className={`p-2.5 sm:p-3 rounded-xl border flex flex-col justify-center ${isFull ? 'bg-gray-50 border-gray-200' : 'bg-green-50 border-green-200'}`}>
                                        <p className={`text-[10px] sm:text-xs font-bold mb-0.5 sm:mb-1 ${isFull ? 'text-gray-500' : 'text-green-700'}`}>สัดส่วนที่รับ</p>
                                        <p className={`text-lg sm:text-xl font-black ${isFull ? 'text-gray-600' : 'text-green-600'}`}>{memberCount} / {club.capacity} <span className="text-[10px] sm:text-sm font-normal">คน</span></p>
                                    </div>
                                </div>
                            </div>

                            <div className="border-t border-gray-100 pt-3 sm:pt-4">
                                <h4 className="font-bold text-gray-800 mb-2 sm:mb-3 flex items-center justify-between text-xs sm:text-base">
                                    <span>รายชื่อสมาชิก</span>
                                    <span className="bg-gray-200 text-gray-700 px-2 sm:px-3 py-0.5 sm:py-1 rounded-full text-[10px] sm:text-xs">{members.length} / {club.capacity}</span>
                                </h4>
                                
                                {isLoadingMembers ? (
                                    <p className="text-xs text-center text-gray-400 py-4">กำลังโหลดข้อมูลรายชื่อ...</p>
                                ) : members.length > 0 ? (
                                    <ul className="space-y-1.5 sm:space-y-2 max-h-48 sm:max-h-60 overflow-y-auto pr-1 sm:pr-2 custom-scrollbar">

                                ) : (
                                    <div className="text-center py-6 sm:py-8 bg-gray-50 rounded-xl border border-dashed border-gray-200">
                                        <Users className="mx-auto text-gray-300 mb-1 sm:mb-2 w-6 h-6 sm:w-8 sm:h-8" />
                                        <p className="text-[10px] sm:text-sm text-gray-500 font-medium">ยังไม่มีสมาชิก</p>
                                    </div>
                                )}
                            </div>

                            {!userHasClub && !isFull && isStudentSide && (
                                <div className="pt-3 sm:pt-4 mt-3 sm:mt-4 border-t border-gray-100">
                                    <button 
                                        onClick={() => { setIsDetailOpen(false); onJoin(); }}
                                        className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 sm:py-3.5 rounded-xl transition shadow-md flex justify-center items-center gap-1 sm:gap-2 text-sm sm:text-lg"
                                    >
                                        ยืนยันเข้าร่วมชุมนุมนี้
                                    </button>
                                    <p className="text-[10px] sm:text-xs text-center text-red-500 mt-2 sm:mt-3 font-bold flex items-center justify-center gap-1">
                                        <AlertTriangle size={12} className="sm:w-3.5 sm:h-3.5"/> เลือกแล้วไม่สามารถแก้ไขได้
                                    </p>
                                </div>
                            )}
                        </div>
                    </Modal>
                </>
            );
        }

        // ==========================================
        // ADMIN DASHBOARD
        // ==========================================
        function AdminDashboard() {
            const [clubs, setClubs] = useState([]);
            const [classes, setClasses] = useState([]);
            const [students, setStudents] = useState([]);
            const [sysSettings, setSysSettings] = useState({ isOpen: false, startTime: '', endTime: '' });
            const [activeTab, setActiveTab] = useState('settings'); 
            const [isLoading, setIsLoading] = useState(true);

            // 🌟 2. ฝั่งผู้ดูแลระบบ (Admin) มีการดึงข้อมูลแบบ Realtime ผ่าน onSnapshot เพื่อให้อัปเดตสถานะแบบเรียลไทม์ได้ถูกต้อง
            useEffect(() => {
                const unsubSettings = onSnapshot(doc(db, 'settings', 'main'), (snap) => {
                    if (snap.exists()) setSysSettings(snap.data());
                });

                const unsubClubs = onSnapshot(collection(db, 'clubs'), (snap) => {
                    setClubs(snap.docs.map(doc => ({ dbKey: doc.id, ...doc.data() })));
                });

                const unsubClasses = onSnapshot(collection(db, 'classes'), (snap) => {
                    setClasses(snap.docs.map(doc => ({ dbKey: doc.id, ...doc.data() })));
                });

                const unsubStudents = onSnapshot(collection(db, 'students'), (snap) => {
                    setStudents(snap.docs.map(doc => ({ dbKey: doc.id, ...doc.data() })));
                    setIsLoading(false);
                });

                return () => {
                    unsubSettings();
                    unsubClubs();
                    unsubClasses();
                    unsubStudents();
                };
            }, []);

            if (isLoading) {
                return <div className="text-center py-10 font-bold text-gray-500">กำลังดึงข้อมูลสำหรับแอดมิน...</div>;
            }

            let tabName = '';
            if(activeTab === 'classes') tabName = 'จัดการห้องเรียนและนักเรียน';
            else if(activeTab === 'clubs') tabName = 'จัดการชุมนุม';
            else if(activeTab === 'reports') tabName = 'รายงานผล';
            else tabName = 'ตั้งค่าระบบ';

            const breadcrumbPath = ['หน้าหลัก (Admin)', tabName];

            return (
                <div className="space-y-4 sm:space-y-6">
                    <Breadcrumb paths={breadcrumbPath} />

                    <div className="flex space-x-1 sm:space-x-2 border-b border-gray-200 pb-px overflow-x-auto custom-scrollbar">
                        <button
                            className={`px-3 sm:px-6 py-2.5 sm:py-3.5 text-xs sm:text-sm font-bold rounded-t-xl sm:rounded-t-2xl transition-colors whitespace-nowrap ${activeTab === 'settings' ? 'bg-white text-blue-600 border-t border-l border-r border-gray-200 -mb-px shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]' : 'text-gray-500 hover:text-gray-700 bg-gray-50/80 hover:bg-gray-100'}`}
                            onClick={() => setActiveTab('settings')}
                        >
                            <div className="flex items-center gap-1.5 sm:gap-2"><Settings size={16} className="sm:w-4 sm:h-4"/> ตั้งค่าระบบ</div>
                        </button>
                        <button
                            className={`px-3 sm:px-6 py-2.5 sm:py-3.5 text-xs sm:text-sm font-bold rounded-t-xl sm:rounded-t-2xl transition-colors whitespace-nowrap ${activeTab === 'reports' ? 'bg-white text-blue-600 border-t border-l border-r border-gray-200 -mb-px shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]' : 'text-gray-500 hover:text-gray-700 bg-gray-50/80 hover:bg-gray-100'}`}
                            onClick={() => setActiveTab('reports')}
                        >
                            <div className="flex items-center gap-1.5 sm:gap-2"><FileText size={16} className="sm:w-4 sm:h-4"/> รายงานผล</div>
                        </button>
                        <button
                            className={`px-3 sm:px-6 py-2.5 sm:py-3.5 text-xs sm:text-sm font-bold rounded-t-xl sm:rounded-t-2xl transition-colors whitespace-nowrap ${activeTab === 'classes' ? 'bg-white text-blue-600 border-t border-l border-r border-gray-200 -mb-px shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]' : 'text-gray-500 hover:text-gray-700 bg-gray-50/80 hover:bg-gray-100'}`}
                            onClick={() => setActiveTab('classes')}
                        >
                            <div className="flex items-center gap-1.5 sm:gap-2"><Users size={16} className="sm:w-4 sm:h-4"/> จัดการห้อง/นักเรียน</div>

                        <button
                            className={`px-3 sm:px-6 py-2.5 sm:py-3.5 text-xs sm:text-sm font-bold rounded-t-xl sm:rounded-t-2xl transition-colors whitespace-nowrap ${activeTab === 'clubs' ? 'bg-white text-blue-600 border-t border-l border-r border-gray-200 -mb-px shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]' : 'text-gray-500 hover:text-gray-700 bg-gray-50/80 hover:bg-gray-100'}`}
                            onClick={() => setActiveTab('clubs')}
                        >
                            <div className="flex items-center gap-1.5 sm:gap-2"><BookOpen size={16} className="sm:w-4 sm:h-4"/> จัดการชุมนุม</div>

                    <div className="bg-white rounded-b-2xl sm:rounded-b-3xl rounded-tr-2xl sm:rounded-tr-3xl shadow-sm border border-gray-200 p-3 sm:p-6 min-h-[500px] sm:min-h-[600px] w-full overflow-hidden">
                        {activeTab === 'settings' ? (
                            <AdminSettings sysSettings={sysSettings} clubs={clubs} students={students} />

                            <AdminReports clubs={clubs} classes={classes} students={students} />

                            <AdminClubs clubs={clubs} students={students} />

                        )}

        // --- ADMIN: SETTINGS ---
        function AdminSettings({ sysSettings, clubs, students }) {
            const [form, setForm] = useState({
                isOpen: false,
                startTime: '',
                endTime: ''
            });
            const [isSaving, setIsSaving] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);

            useEffect(() => {
                if (sysSettings) {
                    setForm({
                        isOpen: sysSettings.isOpen || false,
                        startTime: sysSettings.startTime || '',
                        endTime: sysSettings.endTime || ''
                    });
                }
            }, [sysSettings]);

            const handleSave = async (e) => {
                e.preventDefault();
                setIsSaving(true);
                try {
                    await setDoc(doc(db, 'settings', 'main'), form);
                    Swal.fire({
                        icon: 'success',
                        title: 'สำเร็จ',
                        text: 'บันทึกการตั้งค่าระบบเรียบร้อยแล้ว',
                        confirmButtonColor: '#3b82f6',
                        timer: 1500,
                        showConfirmButton: false,
                        customClass: { popup: 'rounded-2xl' }
                    });
                } catch (err) {
                    Swal.fire({
                        icon: 'error',
                        title: 'ผิดพลาด',
                        text: 'เกิดข้อผิดพลาดในการบันทึกข้อมูล',
                        confirmButtonColor: '#3b82f6',
                        customClass: { popup: 'rounded-2xl' }
                    });
                } finally {
                    setIsSaving(false);
                }
            };

            // 🌟 3. ระบบซิงค์ข้อมูล (Recalculate & Sync Counts) สำหรับ Admin
            const handleSyncClubCounters = async () => {
                setIsSyncing(true);
                try {
                    // คำนวณจำนวนเด็กในแต่ละชุมนุมจริง ๆ จาก students list ณ ขณะนั้น
                    const actualCounts = {};
                    clubs.forEach(club => {
                        actualCounts[club.dbKey] = 0;
                    });
                    
                    students.forEach(student => {
                        if (student.clubId && actualCounts[student.clubId] !== undefined) {
                            actualCounts[student.clubId] += 1;
                        }
                    });

                    // ใช้ writeBatch เพื่อทำการอัปเดต enrolledCount ของทุกชุมนุมพร้อมกัน
                    const batch = writeBatch(db);
                    clubs.forEach(club => {
                        const clubRef = doc(db, 'clubs', club.dbKey);
                        batch.update(clubRef, {
                            enrolledCount: actualCounts[club.dbKey] || 0
                        });
                    });

                    await batch.commit();

                    Swal.fire({
                        icon: 'success',
                        title: 'สำเร็จ',
                        text: 'รีเซ็ตและซิงค์ยอดสมัครเรียนตรงกับรายชื่อปัจจุบันเรียบร้อยแล้ว',
                        confirmButtonColor: '#10b981',
                        customClass: { popup: 'rounded-2xl' }
                    });
                } catch (err) {
                    console.error(err);
                    Swal.fire({
                        icon: 'error',
                        title: 'เกิดข้อผิดพลาด',
                        text: 'เกิดข้อผิดพลาดในการซิงค์ข้อมูล กรุณาลองใหม่อีกครั้ง',
                        confirmButtonColor: '#ef4444',
                        customClass: { popup: 'rounded-2xl' }
                    });
                } finally {
                    setIsSyncing(false);
                }
            };

            return (
                <div className="animate-in fade-in duration-300 max-w-2xl mx-auto mt-4 sm:mt-8 space-y-6">
                    <div className="bg-gray-50 p-6 sm:p-8 rounded-3xl border border-gray-200">
                        <div className="flex items-center gap-3 sm:gap-4 mb-6 sm:mb-8 border-b border-gray-200 pb-4">
                            <div className="bg-blue-100 p-3 rounded-full text-blue-600">
                                <Settings size={28} />
                            </div>
                            <div>
                                <h2 className="text-xl sm:text-2xl font-bold text-gray-800">ตั้งค่าการเปิด-ปิดระบบ</h2>
                                <p className="text-sm text-gray-500 mt-1">ควบคุมเวลาที่นักเรียนสามารถเริ่มเลือกลงทะเบียนชุมนุมได้</p>
                            </div>
                        </div>

                        <form onSubmit={handleSave} className="space-y-6 sm:space-y-8">
                            <div className="bg-white p-5 sm:p-6 rounded-2xl border border-gray-100 shadow-sm flex items-center justify-between">
                                <div>
                                    <p className="font-bold text-gray-800 text-sm sm:text-base">เปิดระบบทันที (Manual Override)</p>
                                    <p className="text-xs sm:text-sm text-gray-500 mt-1">หากเปิดสวิตช์นี้ นักเรียนจะสามารถเข้าลงทะเบียนได้ทันทีโดยไม่สนใจเวลาที่ตั้งไว้</p>
                                </div>
                                <label className="relative inline-flex items-center cursor-pointer">
                                    <input type="checkbox" className="sr-only peer" checked={form.isOpen} onChange={e => setForm({...form, isOpen: e.target.checked})} />
                                    <div className="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-500"></div>
                                </label>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
                                <div className="space-y-1">
                                    <label className="block text-xs sm:text-sm font-bold text-gray-700">กำหนดเวลาเปิดระบบ</label>
                                    <input 
                                        type="datetime-local" 
                                        className="w-full p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-sm"
                                        value={form.startTime}
                                        onChange={e => setForm({...form, startTime: e.target.value})}
                                    />
                                    <p className="text-[10px] sm:text-xs text-gray-400 pl-1">ปล่อยว่างหากไม่ต้องการตั้งเวลา</p>
                                </div>
                                <div className="space-y-1">
                                    <label className="block text-xs sm:text-sm font-bold text-gray-700">กำหนดเวลาปิดระบบ</label>
                                    <input 
                                        type="datetime-local" 
                                        className="w-full p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-sm"
                                        value={form.endTime}
                                        onChange={e => setForm({...form, endTime: e.target.value})}
                                    />
                                    <p className="text-[10px] sm:text-xs text-gray-400 pl-1">ปล่อยว่างหากไม่ต้องการให้ปิดอัตโนมัติ</p>
                                </div>
                            </div>

                            <button 
                                type="submit" 
                                disabled={isSaving}
                                className="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-blue-400 text-white font-bold py-3.5 sm:py-4 rounded-xl transition shadow-md flex justify-center items-center gap-2 text-sm sm:text-lg mt-4"
                            >
                                {isSaving ? 'กำลังบันทึก...' : <><Save size={20} /> บันทึกการตั้งค่า</>}
                            </button>
                        </form>
                    </div>

                    {/* 🌟 3. ปุ่มซิงค์ยอดนับ ในหน้าตั้งค่าแอดมิน */}
                    <div className="bg-white p-6 sm:p-8 rounded-3xl border border-dashed border-red-300 bg-red-50/20">
                        <div className="flex items-center gap-3 mb-4">
                            <RefreshCw size={24} className="text-red-500" />
                            <h3 className="text-lg font-bold text-gray-800">เครื่องมือดูแลระบบ (System Maintenance)</h3>
                        </div>
                        <p className="text-sm text-gray-600 mb-6">
                            หากเกิดปัญหาจำนวนตัวเลขสมัครหน้าเว็บเพี้ยนไม่ตรงกับจำนวนรายชื่อนักเรียนจริง 
                            ปุ่มนี้จะคำนวณจำนวนจริงและทำการเขียนข้อมูลลงฟิลด์ <code>enrolledCount</code> ในคอลเลกชันชุมนุมทั้งหมดใหม่อย่างถูกต้อง
                        </p>
                        <button 
                            onClick={handleSyncClubCounters}
                            disabled={isSyncing}
                            className="bg-red-600 hover:bg-red-700 text-white px-5 py-3 rounded-xl text-sm font-bold flex items-center justify-center gap-2 transition w-full disabled:bg-red-400"
                        >
                            <RefreshCw size={16} className={isSyncing ? "animate-spin" : ""} />
                            {isSyncing ? 'กำลังประมวลผลและอัปเดตยอดจริง...' : 'รีเซ็ตและซิงค์ยอดนับชุมนุมใหม่'}
                        </button>
                    </div>
                </div>
            );
        }

        // --- ADMIN: REPORTS ---
        function AdminReports({ clubs, classes, students }) {
            const [reportType, setReportType] = useState('clubs'); 
            const [searchQuery, setSearchQuery] = useState('');
            const [statusFilter, setStatusFilter] = useState('all'); 

            const [selectedReportClub, setSelectedReportClub] = useState(null);
            const [selectedReportClass, setSelectedReportClass] = useState(null);
            const [selectedReportStudent, setSelectedReportStudent] = useState(null);

            // 🌟 4. ฝั่งรายงาน Admin: แสดงตัวเลขสถิติสมาชิกโดยอ้างอิงจากฟิลด์ club.enrolledCount เป็นมาตรฐานเดียวกันทั้งหมด
            const modalStudents = useMemo(() => {
                if (selectedReportClub) return students.filter(s => s.clubId === selectedReportClub.dbKey);
                if (selectedReportClass) return students.filter(s => s.classId === selectedReportClass.dbKey);
                return [];
            }, [selectedReportClub, selectedReportClass, students]);

            const handleDownloadClubXLSX = async () => {
                if (!selectedReportClub) return;
                try {
                    const XLSX = await loadXLSX();
                    const exportData = modalStudents.map((st, idx) => {
                        const sClass = classes.find(c => c.dbKey === st.classId);
                        return {
                            'ลำดับ': idx + 1,
                            'ห้อง': sClass ? `ม.${sClass.grade}/${sClass.room}` : '',
                            'เลขที่': st.number || '',
                            'รหัสประจำตัว': st.studentId || '',
                            'ชื่อ-สกุล': st.name || '',
                            'เวลาที่ลงทะเบียน': st.joinedAt ? new Date(st.joinedAt).toLocaleString('th-TH') : '-'
                        };
                    });
                    const ws = XLSX.utils.json_to_sheet(exportData);
                    const wb = XLSX.utils.book_new();
                    const sheetName = selectedReportClub.name.substring(0, 31).replace(/[\\/*?:[\]]/g, '');
                    XLSX.utils.book_append_sheet(wb, ws, sheetName || "ชุมนุม");
                    XLSX.writeFile(wb, `รายชื่อชุมนุม_${selectedReportClub.name}.xlsx`);
                } catch(err) {
                    Swal.fire({
                        icon: 'error',
                        title: 'ผิดพลาด',
                        text: 'เกิดข้อผิดพลาดในการดาวน์โหลดไฟล์',
                        confirmButtonColor: '#3b82f6',
                        customClass: { popup: 'rounded-2xl' }
                    });
                }
            };

            const filteredReportClubs = useMemo(() => {
                return clubs.filter(club => {
                    const matchSearch = club.name.toLowerCase().includes(searchQuery.toLowerCase());
                    const enrolled = club.enrolledCount || 0; // Source of Truth
                    const isFull = enrolled >= club.capacity;
                    
                    let matchStatus = true;
                    if (statusFilter === 'full') matchStatus = isFull;
                    if (statusFilter === 'available') matchStatus = !isFull;

                    return matchSearch && matchStatus;
                });
            }, [clubs, searchQuery, statusFilter]);

            const sortedClasses = useMemo(() => {
                return [...classes].sort((a, b) => a.grade === b.grade ? a.room - b.room : a.grade - b.grade);
            }, [classes]);

            return (
                <div className="animate-in fade-in duration-300">
                    <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-4 sm:mb-6 gap-4">
                        <div className="bg-blue-50 p-1 rounded-xl inline-flex w-full sm:w-auto">
                            <button 
                                className={`px-4 py-2 sm:py-2.5 rounded-lg text-xs sm:text-sm font-bold transition flex-1 sm:flex-none whitespace-nowrap ${reportType === 'clubs' ? 'bg-white shadow-sm text-blue-700' : 'text-blue-600 hover:bg-blue-100/50'}`}
                                onClick={() => { setReportType('clubs'); setSearchQuery(''); setStatusFilter('all'); }}
                            >ดูตามชุมนุม</button>
                            <button 
                                className={`px-4 py-2 sm:py-2.5 rounded-lg text-xs sm:text-sm font-bold transition flex-1 sm:flex-none whitespace-nowrap ${reportType === 'classes' ? 'bg-white shadow-sm text-blue-700' : 'text-blue-600 hover:bg-blue-100/50'}`}
                                onClick={() => setReportType('classes')}
                            >ดูตามห้องเรียน</button>
                        </div>

                        {reportType === 'clubs' && (
                            <div className="flex flex-col sm:flex-row gap-2 sm:gap-3 w-full lg:w-auto">
                                <div className="relative w-full sm:w-64">
                                    <Search className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400" size={16} />
                                    <input 
                                        type="text" placeholder="ค้นหาชื่อชุมนุม..." 
                                        className="w-full pl-9 pr-3 py-2 sm:py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-xs sm:text-sm"
                                        value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)}
                                    />
                                </div>
                                <select 
                                    className="w-full sm:w-auto px-3 py-2 sm:py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-xs sm:text-sm bg-white"
                                    value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)}
                                >
                                    <option value="all">สถานะ: ทั้งหมด</option>
                                    <option value="full">สถานะ: เต็มแล้ว</option>
                                    <option value="available">สถานะ: ยังว่าง</option>
                                </select>
                            </div>
                        )}
                    </div>

                    {reportType === 'clubs' && (
                        <div className="overflow-x-auto rounded-xl sm:rounded-2xl border border-gray-200 shadow-sm max-h-[500px] custom-scrollbar w-full">
                            <table className="w-full text-left border-collapse whitespace-nowrap min-w-[600px]">
                                <thead className="sticky top-0 z-10 bg-gray-50 border-b border-gray-200">
                                    <tr className="text-gray-600 text-[10px] sm:text-xs">
                                        <th className="p-3 sm:p-4 font-bold">ชื่อชุมนุม</th>
                                        <th className="p-3 sm:p-4 font-bold text-center">ระดับชั้น</th>
                                        <th className="p-3 sm:p-4 font-bold text-center">ลงแล้ว / รับได้</th>
                                        <th className="p-3 sm:p-4 font-bold text-center">สถานะ</th>
                                        <th className="p-3 sm:p-4 font-bold text-center">รายละเอียด</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-100 bg-white">
                                    {filteredReportClubs.map(club => {
                                        // 🌟 4. หน้าตารางแอดมิน: ใช้ enrolled จาก Firestore ของชุมนุม (enrolledCount) เพื่อให้ตรงกันกับหน้าผู้ใช้อื่น
                                        const enrolled = club.enrolledCount || 0;
                                        const isFull = enrolled >= club.capacity;
                                        return (
                                            <tr key={club.dbKey} className="hover:bg-gray-50 transition">
                                                <td className="p-3 sm:p-4 font-bold text-gray-800 text-[10px] sm:text-sm break-words whitespace-normal min-w-[200px]">{club.name}</td>
                                                <td className="p-3 sm:p-4 text-center">
                                                    <span className={`px-2 py-1 rounded text-[9px] sm:text-xs font-bold ${club.category === 'm_ton' ? 'bg-purple-100 text-purple-700' : 'bg-orange-100 text-orange-700'}`}>
                                                        {club.category === 'm_ton' ? 'ม.ต้น' : 'ม.ปลาย'}
                                                    </span>
                                                </td>
                                                <td className="p-3 sm:p-4 text-center text-xs sm:text-sm">
                                                    <span className="font-bold">{enrolled}</span> / {club.capacity}
                                                </td>
                                                <td className="p-3 sm:p-4 text-center">
                                                    <span className={`px-2 py-1 rounded-full text-[9px] sm:text-xs font-bold ${isFull ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-600'}`}>
                                                        {isFull ? 'เต็มแล้ว' : 'ยังว่าง'}
                                                    </span>
                                                </td>
                                                <td className="p-3 sm:p-4 text-center">
                                                    <button onClick={() => setSelectedReportClub(club)} className="text-blue-600 bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-lg text-xs font-bold transition border border-blue-200">
                                                        ดูรายชื่อ
                                                    </button>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                    {filteredReportClubs.length === 0 && (
                                        <tr><td colSpan="5" className="p-8 text-center text-gray-400 font-medium text-xs sm:text-sm">ไม่พบข้อมูลที่ค้นหา</td></tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {reportType === 'classes' && (
                        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 sm:gap-4 max-h-[500px] overflow-y-auto custom-scrollbar p-1">
                            {sortedClasses.map(cls => {
                                const classStudents = students.filter(s => s.classId === cls.dbKey);
                                const registeredCount = classStudents.filter(s => s.clubId).length;
                                
                                return (
                                    <div 
                                        key={cls.dbKey}
                                        onClick={() => setSelectedReportClass(cls)}
                                        className="bg-white border border-gray-200 p-4 rounded-xl hover:border-blue-400 hover:shadow-md cursor-pointer transition transform hover:-translate-y-1"
                                    >
                                        <div className="flex justify-between items-center mb-2">
                                            <h4 className="text-lg sm:text-xl font-black text-gray-800">ม.{cls.grade}/{cls.room}</h4>
                                            <ChevronRight size={16} className="text-gray-300" />
                                        </div>
                                        <div className="text-[10px] sm:text-xs text-gray-500 space-y-1">
                                            <p>นักเรียนทั้งหมด: {classStudents.length} คน</p>
                                            <p className="text-green-600 font-bold">ลงแล้ว: {registeredCount} คน</p>
                                            <p className="text-red-500">ยังไม่ลง: {classStudents.length - registeredCount} คน</p>
                                        </div>
                                    </div>
                                );
                            })}
                            {sortedClasses.length === 0 && (
                                <div className="col-span-full text-center py-10 text-gray-400 text-sm">ยังไม่มีข้อมูลห้องเรียน</div>
                            )}
                        </div>
                    )}

                    {/* Modal: Club Report Details */}
                    {selectedReportClub && (
                        <Modal isOpen={!!selectedReportClub} onClose={() => setSelectedReportClub(null)} title={`รายชื่อนักเรียน: ${selectedReportClub.name}`} maxWidth="max-w-2xl">
                            <div className="mb-4 bg-gray-50 p-3 rounded-xl border border-gray-100 flex flex-wrap justify-between items-center gap-2">
                                <div className="flex gap-2 sm:gap-4 items-center flex-wrap">
                                    <span className="text-xs sm:text-sm font-bold text-gray-600">ครูผู้สอน: {selectedReportClub.teacher}</span>
                                    <span className="text-xs sm:text-sm font-bold text-gray-600 bg-white px-3 py-1 rounded-lg border border-gray-200">
                                        ยอดรับ: {modalStudents.length}/{selectedReportClub.capacity}
                                    </span>
                                </div>
                                <button 
                                    onClick={handleDownloadClubXLSX}
                                    className="bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-lg text-[10px] sm:text-xs font-bold flex items-center gap-1.5 transition shadow-sm"
                                >
                                    <Download size={14} /> โหลดรายชื่อ (XLSX)
                                </button>
                            </div>
                            <div className="overflow-x-auto rounded-xl border border-gray-200">
                                <table className="w-full text-left text-[10px] sm:text-xs whitespace-nowrap">
                                    <thead className="bg-gray-100 border-b border-gray-200">
                                        <tr>
                                            <th className="p-3 font-bold text-gray-600">ลำดับ</th>
                                            <th className="p-3 font-bold text-gray-600">ห้อง</th>
                                            <th className="p-3 font-bold text-gray-600">เลขที่</th>
                                            <th className="p-3 font-bold text-gray-600">รหัสประจำตัว</th>
                                            <th className="p-3 font-bold text-gray-600">ชื่อ-สกุล</th>
                                            <th className="p-3 font-bold text-gray-600">เวลาที่ลงทะเบียน</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-100">
                                        {modalStudents.map((st, idx) => {
                                            const sClass = classes.find(c => c.dbKey === st.classId);
                                            return (
                                                <tr key={st.dbKey} className="hover:bg-gray-50">
                                                    <td className="p-3 text-center text-gray-500 font-bold">{idx + 1}</td>
                                                    <td className="p-3 font-medium">ม.{sClass?.grade}/{sClass?.room}</td>
                                                    <td className="p-3 text-center">{st.number}</td>
                                                    <td className="p-3">{st.studentId}</td>
                                                    <td className="p-3">{st.name}</td>
                                                    <td className="p-3 text-gray-500">{st.joinedAt ? new Date(st.joinedAt).toLocaleString('th-TH') : '-'}</td>
                                                </tr>
                                            )
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </Modal>
                    )}

                    {/* Modal: Class Report Details */}
                    {selectedReportClass && (
                        <Modal isOpen={!!selectedReportClass} onClose={() => {setSelectedReportClass(null); setSelectedReportStudent(null);}} title={`รายงานห้องเรียน: ม.${selectedReportClass.grade}/${selectedReportClass.room}`} maxWidth={selectedReportStudent ? "max-w-md" : "max-w-2xl"}>
                            {!selectedReportStudent ? (
                                <div className="overflow-x-auto rounded-xl border border-gray-200 custom-scrollbar max-h-[60vh]">
                                    <table className="w-full text-left text-[10px] sm:text-xs whitespace-nowrap">
                                        <thead className="bg-gray-100 border-b border-gray-200 sticky top-0">
                                            <tr>
                                                <th className="p-3 font-bold text-gray-600">เลขที่</th>
                                                <th className="p-3 font-bold text-gray-600">ชื่อ-สกุล</th>
                                                <th className="p-3 font-bold text-gray-600">สถานะ</th>
                                                <th className="p-3 font-bold text-center text-gray-600">รายละเอียด</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-gray-100">
                                            {[...modalStudents].sort((a,b) => (a.number||0) - (b.number||0)).map((st) => {
                                                const hasClub = !!st.clubId;
                                                return (
                                                    <tr key={st.dbKey} className="hover:bg-gray-50">
                                                        <td className="p-3 text-center">{st.number}</td>
                                                        <td className="p-3 font-medium">{st.name}</td>
                                                        <td className="p-3">
                                                            <span className={`px-2 py-1 rounded text-[9px] font-bold ${hasClub ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-600'}`}>
                                                                {hasClub ? 'ลงแล้ว' : 'ยังไม่ลง'}
                                                            </span>
                                                        </td>
                                                        <td className="p-3 text-center">
                                                            <button onClick={() => setSelectedReportStudent(st)} className="text-blue-600 bg-blue-50 hover:bg-blue-100 px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg text-[10px] sm:text-xs font-bold transition border border-blue-200">
                                                                ดูข้อมูล
                                                            </button>
                                                        </td>
                                                    </tr>
                                                )
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            ) : (
                                <div className="animate-in slide-in-from-right-4 duration-300">
                                    <button onClick={() => setSelectedReportStudent(null)} className="mb-4 text-sm font-bold text-gray-500 hover:text-gray-800 flex items-center gap-1">
                                        <ChevronRight className="rotate-180" size={16}/> กลับไปหน้ารายชื่อห้อง
                                    </button>

                                    <div className="bg-gray-50 rounded-xl p-4 sm:p-6 border border-gray-200 text-center relative overflow-hidden">
                                        <div className={`absolute top-0 left-0 right-0 h-2 ${selectedReportStudent.clubId ? 'bg-green-500' : 'bg-red-500'}`}></div>
                                        <Users className="mx-auto text-gray-400 mb-3" size={40}/>
                                        <h3 className="text-lg sm:text-xl font-bold text-gray-800">{selectedReportStudent.name}</h3>
                                        <p className="text-gray-500 text-xs sm:text-sm mt-1">เลขที่ {selectedReportStudent.number} | รหัส {selectedReportStudent.studentId}</p>
                                        
                                        <div className="mt-6 text-left border-t border-gray-200 pt-4 space-y-3">
                                            <p className="text-xs text-gray-400 font-bold uppercase tracking-wider">สถานะการลงทะเบียนชุมนุม</p>
                                            {selectedReportStudent.clubId ? (
                                                <div className="bg-green-50 p-4 rounded-xl border border-green-200">
                                                    <h4 className="font-bold text-green-800 text-sm sm:text-base mb-1">{clubs.find(c => c.dbKey === selectedReportStudent.clubId)?.name || 'ไม่ทราบชื่อชุมนุม'}</h4>
                                                    <p className="text-xs text-green-700 mb-2">ครูผู้สอน: {clubs.find(c => c.dbKey === selectedReportStudent.clubId)?.teacher}</p>
                                                    <div className="text-[10px] text-green-600 font-bold bg-green-100 inline-block px-2 py-1 rounded">
                                                        ลงทะเบียนเมื่อ: {formatDate(selectedReportStudent.joinedAt)}
                                                    </div>
                                                </div>
                                            ) : (
                                                <div className="bg-red-50 p-4 rounded-xl border border-red-200 flex items-center gap-3">
                                                    <AlertTriangle className="text-red-500" size={24}/>
                                                    <p className="font-bold text-red-700 text-sm">ยังไม่ได้เลือกลงทะเบียนชุมนุม</p>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </Modal>
                    )}
                </div>
            );
        }

        // --- ADMIN: CLUBS ---
        function AdminClubs({ clubs, students }) {
            const [viewFilter, setViewFilter] = useState('all'); 
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingClub, setEditingClub] = useState(null);
            const [formData, setFormData] = useState({ name: '', teacher: '', capacity: 20, category: 'm_ton' });
            const [isImportingClubs, setIsImportingClubs] = useState(false);
            const clubFileInputRef = useRef(null);

            const filteredClubs = useMemo(() => {
                if (viewFilter === 'all') return clubs;
                return clubs.filter(c => c.category === viewFilter);
            }, [clubs, viewFilter]);

            const handleOpenModal = (club = null) => {
                if (club) {
                    setEditingClub(club);
                    setFormData({ name: club.name, teacher: club.teacher, capacity: club.capacity, category: club.category });
                } else {
                    setEditingClub(null);
                    setFormData({ name: '', teacher: '', capacity: 20, category: viewFilter === 'all' ? 'm_ton' : viewFilter });
                }
                setIsModalOpen(true);
            };

            const handleSave = async (e) => {
                e.preventDefault();
                try {
                    // 🌟 บันทึก/อัปเดตข้อมูลโครงสร้างใหม่พร้อมค่าตั้งต้น enrolledCount: 0
                    if (editingClub) {
                        await updateDoc(doc(db, 'clubs', editingClub.dbKey), formData);
                    } else {
                        await addDoc(collection(db, 'clubs'), {
                            ...formData,
                            enrolledCount: 0
                        });
                    }
                    setIsModalOpen(false);
                    Swal.fire({
                        icon: 'success',
                        title: 'สำเร็จ',
                        text: 'บันทึกข้อมูลชุมนุมเสร็จสิ้น',
                        confirmButtonColor: '#3b82f6',
                        customClass: { popup: 'rounded-2xl' }
                    });
                } catch (err) {
                    console.error(err);
                }
            };

            const handleDelete = async (dbKey) => {
                const clubObj = clubs.find(c => c.dbKey === dbKey);
                const enrolled = clubObj ? (clubObj.enrolledCount || 0) : 0;
                
                if (enrolled > 0) {
                    Swal.fire({
                        icon: 'error',
                        title: 'ลบไม่สำเร็จ',
                        text: 'ไม่สามารถลบชุมนุมที่มีนักเรียนลงทะเบียนแล้วได้',
                        confirmButtonColor: '#3b82f6',
                        customClass: { popup: 'rounded-2xl' }
                    });
                    return;
                }
                
                const result = await Swal.fire({
                    title: 'ยืนยันการลบชุมนุม?',
                    text: "คุณต้องการลบข้อมูลชุมนุมนี้ออกจากระบบใช่หรือไม่!",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#ef4444',
                    cancelButtonColor: '#3b82f6',
                    confirmButtonText: 'ยืนยันการลบ',
                    cancelButtonText: 'ยกเลิก',
                    customClass: { popup: 'rounded-2xl' }
                });

                if (result.isConfirmed) {
                    await deleteDoc(doc(db, 'clubs', dbKey));
                    Swal.fire({
                        icon: 'success',
                        title: 'ลบสำเร็จ',
                        text: 'ลบข้อมูลชุมนุมออกจากระบบแล้ว',
                        confirmButtonColor: '#3b82f6',
                        customClass: { popup: 'rounded-2xl' }
                    });
                }
            };

            const handleClubFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setIsImportingClubs(true);
                try {
                    const XLSX = await loadXLSX();
                    const data = await file.arrayBuffer();
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    let importedCount = 0;

                    for (const sheetName of workbook.SheetNames) {
                        let category = null;
                        if (sheetName.includes('ต้น') || sheetName.toLowerCase().includes('ton')) {
                            category = 'm_ton';
                        } else if (sheetName.includes('ปลาย') || sheetName.toLowerCase().includes('plai')) {
                            category = 'm_plai';
                        }

                        if (category) {
                            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);
                            for (const row of rows) {
                                const name = row['ชื่อชุมนุม'] || row['ชื่อชุมนุม (สำหรับม.ต้นเท่านั้น)'] || row['ชื่อชุมนุม (สำหรับม.ปลายเท่านั้น)'] || row['name'] || row['Name'] || Object.values(row)[0];
                                const teacher = row['ครูผู้สอน'] || row['ผู้สอน'] || row['teacher'] || row['Teacher'] || Object.values(row)[1];
                                const capacity = row['จำนวนรับ'] || row['จำนวน'] || row['capacity'] || row['Capacity'] || Object.values(row)[2];

                                if (name && String(name).trim() !== "") {
                                    const newClub = {
                                        name: String(name).trim(),
                                        teacher: teacher ? String(teacher).trim() : 'ไม่ระบุผู้สอน',
                                        capacity: capacity ? parseInt(capacity) : 20,
                                        category: category,
                                        enrolledCount: 0
                                    };

                                    await addDoc(collection(db, 'clubs'), newClub);
                                    importedCount++;
                                }
                            }
                        }
                    }

                    Swal.fire({
                        icon: 'success',
                        title: 'นำเข้าสำเร็จ',
                        text: `นำเข้าข้อมูลชุมนุมสำเร็จทั้งหมด ${importedCount} รายการ!`,
                        confirmButtonColor: '#10b981',
                        customClass: { popup: 'rounded-2xl' }
                    });
                } catch (error) {
                    Swal.fire({
                        icon: 'error',
                        title: 'ผิดพลาด',
                        text: 'เกิดข้อผิดพลาดในการนำเข้าไฟล์ กรุณาตรวจสอบรูปแบบไฟล์และชื่อแท็บ (ม.ต้น / ม.ปลาย)',
                        confirmButtonColor: '#ef4444',
                        customClass: { popup: 'rounded-2xl' }
                    });
                } finally {
                    setIsImportingClubs(false);
                    if (clubFileInputRef.current) clubFileInputRef.current.value = '';
                }
            };

            return (
                <div className="animate-in fade-in duration-300">
                    <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-4 sm:mb-6 gap-3 sm:gap-4">
                        <div className="bg-gray-100 p-1 rounded-lg sm:rounded-xl inline-flex w-full lg:w-auto overflow-x-auto custom-scrollbar">
                            <button 
                                className={`px-3 sm:px-4 py-1.5 sm:py-2 rounded-md sm:rounded-lg text-[10px] sm:text-sm font-bold transition whitespace-nowrap ${viewFilter === 'all' ? 'bg-white shadow text-blue-600' : 'text-gray-600 hover:text-gray-900'}`}
                                onClick={() => setViewFilter('all')}
                            >ทั้งหมด</button>
                            <button 
                                className={`px-3 sm:px-4 py-1.5 sm:py-2 rounded-md sm:rounded-lg text-[10px] sm:text-sm font-bold transition whitespace-nowrap ${viewFilter === 'm_ton' ? 'bg-purple-100 text-purple-700 shadow' : 'text-gray-600 hover:text-gray-900'}`}
                                onClick={() => setViewFilter('m_ton')}
                            >ม.ต้น (1-3)</button>
                            <button 
                                className={`px-3 sm:px-4 py-1.5 sm:py-2 rounded-md sm:rounded-lg text-[10px] sm:text-sm font-bold transition whitespace-nowrap ${viewFilter === 'm_plai' ? 'bg-orange-100 text-orange-700 shadow' : 'text-gray-600 hover:text-gray-900'}`}
                                onClick={() => setViewFilter('m_plai')}
                            >ม.ปลาย (4-6)</button>
                        </div>

                        <div className="flex flex-col sm:flex-row gap-2 sm:gap-3 w-full lg:w-auto">
                            <input 
                                type="file" 
                                accept=".xlsx, .xls" 
                                className="hidden" 
                                ref={clubFileInputRef}
                                onChange={handleClubFileUpload}
